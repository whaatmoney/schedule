          </div>
        </td>
      </tr>`;
      return html;
    }).join("");
  }

  return `<div class="card">
    <table class="t"><thead><tr>
      <th style="width:16%">Department</th><th class="c" style="width:7%">Signal</th><th class="r" style="width:6%">AR%</th>
      <th class="c" style="width:6%">Aging</th><th class="c" style="width:6%">Total</th>
      <th class="c" style="width:7%" title="Jobs marked 03 - Complete at this dept's location but not yet handed off — handoff-bottleneck signal">Complete</th>
      <th class="c" style="width:7%" title="Non-aging jobs with Start By within 3 biz days">Upcoming</th>
      <th style="width:10%" title="Most frequent profile among aging jobs">Top Profile</th>
      <th style="width:9%">Ratio</th>
      <th style="width:17%">Flags</th><th class="c" style="width:9%">OT</th>
    </tr></thead><tbody>
      ${renderRows(main, 0)}
      <tr><td colspan="11" class="sl">Lab Testing / Customer Holds</td></tr>
      ${renderRows(bottom, main.length)}
    </tbody></table>
    <div class="biz-note"><strong>Complete</strong> = jobs marked 03 - Complete at this dept's physical location but not yet moved to the next op (handoff-bottleneck signal — red &gt;20%, amber &gt;10%). <strong>Upcoming</strong> = non-aging jobs with Start By ≤ 3 biz days. <strong>Top Profile</strong> = dominant profile among aging jobs (tap row for full mix + guidance). <span style="color:var(--sig-red)">Red</span> = tight-window profile, <span style="color:var(--sig-green)">green</span> = long-window, <span style="color:var(--sig-amber)">amber</span> = unclassified.</div>
  </div>`;
}

// ─── TAB 2: JOB FLAGS ───
let deptFilter = "All";
let flagFilter = "Action";
const ACTION_FLAGS = new Set(["Past Due", "Critical", "Reschedule Window"]);
let profileFilter = "All";

function buildJobTable() {
  let jobs = DATA.allAgingJobs.slice();
  if (deptFilter !== "All") jobs = jobs.filter(j => j.dept === deptFilter);
  if (flagFilter === "Action") jobs = jobs.filter(j => ACTION_FLAGS.has(j.flag));
  else if (flagFilter !== "All") jobs = jobs.filter(j => j.flag === flagFilter);
  if (profileFilter !== "All") {
    if (profileFilter === "(Unclassified)") jobs = jobs.filter(j => j.isUnclassified);
    else jobs = jobs.filter(j => j.profile === profileFilter);
  }
  jobs.sort((a, b) => {
    const fi = FLAG_ORDER.indexOf(a.flag) - FLAG_ORDER.indexOf(b.flag);
    return fi !== 0 ? fi : ((a.msBD ?? 999) - (b.msBD ?? 999));
  });
  const rows = jobs.map((j, i) => {
    const fc = FLAG_COLORS[j.flag];
    const dc = getTier(DATA.departments.find(d => d.name === j.dept)?.ar || 0).ink;
    const shortBadge = j.isShortScheduled
      ? `<span style="font-size:9px;font-weight:700;color:var(--sig-red);background:var(--tint-red);padding:1px 6px;border-radius:4px;margin-left:4px" title="Scheduled tighter than profile minimum">SHORT</span>`
      : "";
    return `<tr class="${i%2===0?'s0':'s1'}">
      <td style="border-left:3px solid ${fc};padding-left:12px"><span style="color:${fc};font-weight:700;font-size:11px">${j.flag}</span></td>
      <td class="mc" style="font-weight:700;color:var(--text-strong)">${j.wo}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${esc(j.customer)}</td>
      <td style="color:${dc};font-weight:600">${j.dept}</td>
      <td>${profilePill(j)}${shortBadge}</td>
      <td>${profileMarginCell(j)}</td>
      <td class="r mc" style="color:var(--text-2)">${esc(j.dueDate)}</td>
      <td class="r mc" style="color:${msBDColor(j.msBD)};font-weight:700">${j.msBD ?? '\u2014'}</td>
      <td class="r mc" style="color:${dueBDColor(j.dueBD)};font-weight:700">${j.dueBD ?? '\u2014'}</td>
      <td style="${prioStyle(j.priority)}">${j.priority}</td>
      <td class="c">${j.rescheduled ? '<span style="color:#D13438;font-weight:700;font-size:10px">BURNED</span>' : '<span style="color:#EDEBE9">\u2014</span>'}</td>
    </tr>`;
  }).join("");
  setTimeout(() => {
    const el = document.getElementById("jobCount");
    if (el) el.textContent = `${jobs.length} jobs — Profile Margin bar: burn % of profile max (red = past profile window). Ms BD = biz days to dept milestone. Due BD = biz days to QPC Due Date.`;
  }, 0);
  return `<table class="t"><thead><tr><th>Flag</th><th>WO</th><th>Customer</th><th>Dept</th><th>Profile</th><th>Profile Margin</th><th class="r">Due</th><th class="r">Ms BD</th><th class="r">Due BD</th><th>Priority</th><th class="c">Resched</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function buildUpcomingTable() {
  let jobs = (DATA.upcomingJobs || []).slice();
  if (deptFilter !== "All") jobs = jobs.filter(j => j.dept === deptFilter);
  if (profileFilter !== "All") {
    if (profileFilter === "(Unclassified)") jobs = jobs.filter(j => !j.profile);
    else jobs = jobs.filter(j => j.profile === profileFilter);
  }
  if (jobs.length === 0) {
    return `<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px">No upcoming jobs for the selected filter.</div>`;
  }
  const rows = jobs.map((j, i) => {
    const dc = getTier(DATA.departments.find(d => d.name === j.dept)?.ar || 0).ink;
    const msBDC = j.msBD <= 0 ? "#D13438" : j.msBD === 1 ? "var(--acc-orange)" : "var(--acc-blue)";
    const msBDLabel = j.msBD <= 0 ? "START NOW" : j.msBD === 1 ? "TOMORROW" : `${j.msBD}d`;
    const prof = j.profile
      ? `<span class="prof-pill">${esc(j.profile)}</span>`
      : `<span class="prof-pill unc">—</span>`;
    return `<tr class="${i%2===0?'s0':'s1'}">
      <td class="mc" style="font-weight:700;color:var(--text-strong);border-left:3px solid var(--acc-blue);padding-left:12px">${j.wo}</td>
      <td style="color:${dc};font-weight:600">${j.dept}</td>
      <td>${prof}</td>
      <td class="r mc" style="color:var(--text-2)">${esc(j.msDate || '\u2014')}</td>
      <td class="r mc" style="color:${msBDC};font-weight:700">${j.msBD ?? '\u2014'} <span style="font-size:9px;font-weight:700;letter-spacing:.5px;color:${msBDC}">${msBDLabel}</span></td>
      <td class="r mc" style="color:var(--text-2)">${esc(j.dueDate)}</td>
      <td class="r mc" style="color:${dueBDColor(j.dueBD)};font-weight:700">${j.dueBD ?? '\u2014'}</td>
      <td style="${prioStyle(j.priority)}">${esc(j.priority) || '\u2014'}</td>
    </tr>`;
  }).join("");
  return `<table class="t"><thead><tr>
    <th>WO</th><th>Dept</th><th>Profile</th><th class="r">Start By</th><th class="r">Ms BD</th><th class="r">Due</th><th class="r">Due BD</th><th>Priority</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function buildJobFlags() {
  let flagSummary = FLAG_ORDER.map((f, i) => {
    const ct = DATA.overall.flagDist[f] || 0;
    if (!ct) return "";
    return `<tr class="${i%2===0?'s0':'s1'}">
      <td style="border-left:4px solid ${FLAG_COLORS[f]};padding-left:16px"><span style="font-weight:700;font-size:13px;color:${FLAG_COLORS[f]}">${f}</span></td>
      <td class="c"><span class="mc" style="font-size:22px;font-weight:700;color:${FLAG_COLORS[f]}">${ct}</span></td>
      <td style="font-size:12px;color:var(--text-2);line-height:1.55">${FLAG_DEFS[f]}</td>
    </tr>`;
  }).join("");

  let crossTab = DATA.departments.filter(d => d.aging > 0).map((d, i) => {
    const { ink: color } = getTier(d.ar);
    const cuClass = d.isCustomerDep ? " cu" : "";
    const cells = FLAG_ORDER.map(f => {
      const v = d.flags[f] || 0;
      return `<td class="c mc" style="color:${v ? FLAG_COLORS[f] : '#EDEBE9'};font-weight:${v?700:400}">${v || '\u00b7'}</td>`;
    }).join("");
    return `<tr class="${i%2===0?'s0':'s1'}${cuClass}">
      <td style="border-left:4px solid ${color};padding-left:16px;font-weight:600">${d.name === "Customer Hold (Profile)" ? "Customer Hold" : d.name}${d.isCustomerDep?' \u2298':''}</td>
      ${cells}
      <td class="c mc" style="color:${color};font-weight:700">${d.aging}</td>
    </tr>`;
  }).join("");

  const deptBtns = ["All",...MENU_ORDER].map(d =>
    `<button class="fb${deptFilter===d?' on':''}" onclick="setDeptFilter('${d}')">${d==="All"?"All Depts":(d==="Customer Hold (Profile)"?"Cust Hold":d)}</button>`
  ).join("");
  const flagBtns = ["Action","All",...FLAG_ORDER].map(f => {
    const c = f !== "All" ? FLAG_COLORS[f] : undefined;
    const style = flagFilter === f && c ? ` style="border-color:${c};color:${c}"` : "";
    return `<button class="fb${flagFilter===f?' on':''}"${style} onclick="setFlagFilter('${f.replace(/'/g,"\\'")}')"><span>${f==="Action"?"Needs Action":(f==="All"?"All Flags":f)}</span></button>`;
  }).join("");

  // Profile filter chips, built from PROFILE rules + (Unclassified)
  const profileNames = Object.keys(DATA.profileRules || {});
  const profileBtns = ["All", ...profileNames, "(Unclassified)"].map(p =>
    `<button class="fb${profileFilter===p?' on':''}" onclick="setProfileFilter('${p.replace(/'/g,"\\'")}')"><span>${p==="All"?"All Profiles":p}</span></button>`
  ).join("");

  const upcomingCount = DATA.overall.upcomingCount || 0;

  return `
    <div class="st">Flag × Department</div>
    <div class="card" style="margin-bottom:16px">
      <table class="t" style="font-size:12px"><thead><tr>
        <th style="width:18%">Department</th>
        ${FLAG_ORDER.map(f => `<th class="c" style="color:${FLAG_COLORS[f]}">${f.replace("Reschedule Window","Resched")}</th>`).join("")}
        <th class="c">Total</th>
      </tr></thead><tbody>${crossTab}</tbody></table>
    </div>

    <div class="st">All Aging Jobs (${DATA.allAgingJobs.length})</div>
    <div class="fl">${deptBtns}</div>
    <div class="fl">${flagBtns}</div>
    <div class="fl">${profileBtns}</div>
    <div class="card sw" id="jobTableWrap">${buildJobTable()}</div>
    <div class="nt" id="jobCount"></div>

    <details class="card" style="margin-top:24px;padding:0">
      <summary style="cursor:pointer;padding:12px 16px;font-size:13px;font-weight:600;color:var(--text-strong)">Upcoming — approaching Start By <span style="font-weight:400;color:var(--text-muted)">· ${upcomingCount} non-aging WOs within 3 biz days — get ahead of them before they age</span></summary>
      <div style="padding:0 12px 12px">
        <div class="fl">${deptBtns}</div>
        <div class="fl">${profileBtns}</div>
        <div class="sw" id="upcomingTableWrap">${buildUpcomingTable()}</div>
      </div>
    </details>
    <div class="biz-note">Ms BD = biz days to dept Start By. Due BD = biz days to QPC Due Date. Mon–Fri, 7:00a–3:30p</div>`;
}

function setDeptFilter(d) { deptFilter = d; document.getElementById("tab1").innerHTML = buildJobFlags(); }
function setFlagFilter(f) { flagFilter = f; document.getElementById("tab1").innerHTML = buildJobFlags(); }
function setProfileFilter(p) { profileFilter = p; document.getElementById("tab1").innerHTML = buildJobFlags(); }

// ─── TAB 3: RESCHEDULE STATUS (v12 — decision-first) ───
function buildReschedule() {
  const RS = DATA.rescheduleStatus || {};
  const { rescheduledCount, reschedulePct, totalInHouse } = DATA.reschedule || {};
  const buf_color = reschedulePct >= 20 ? "#D13438" : reschedulePct >= 15 ? "#C19C00" : "#107C10";

  const target = RS.kpiTarget || 98;
  const onTime = RS.onTimeCount ?? 0;
  const totalAssessed = RS.totalAssessed ?? 0;
  const onTimePct = RS.onTimePct ?? 100;
  const atRiskCount = RS.atRiskCount ?? 0;
  const decideToday = RS.decideToday || [];
  const decideWeek = RS.decideWeek || [];
  const notify = RS.notify || [];
  const monitor = RS.monitor || [];
  const escalate = RS.escalate || [];

  const above_kpi = onTimePct >= target;
  const hero_state = above_kpi ? "ok" : "warn";
  const hero_num_color = above_kpi ? "#0B6A0B" : "#7A6200";
  const marker_color = above_kpi ? "#0B6A0B" : "#C19C00";
  const recoverable = decideToday.length + decideWeek.length;
  const proj_after_action = totalAssessed > 0 ? Math.round(100.0 * (onTime + recoverable) / totalAssessed) : 100;
  const exception_total = decideToday.length + decideWeek.length + notify.length;

  const heroContext = above_kpi
    ? "At the <strong>" + target + "% OTD KPI</strong> measured against current QPC Due Date. <strong>" + atRiskCount + " forecast miss" + (atRiskCount===1?'':'es') + "</strong> in the sections below. The other " + onTime + " are forecast to land on or before their current QPC Due."
    : "<strong>" + (target - Math.floor(onTimePct)) + " point" + ((target - Math.floor(onTimePct))===1?'':'s') + " below the " + target + "% OTD KPI today.</strong> " + atRiskCount + " forecast miss" + (atRiskCount===1?'':'es') + ": " + notify.length + " in Notify (already burned, miss locked in)" + (recoverable>0?', '+recoverable+' in Decide today/week (recoverable by burning)':'') + ". " + (recoverable>0?"Burning the Decide jobs recovers the forecast to <strong>" + proj_after_action + "%</strong>.":'');

  const escHtml = (s) => esc(String(s == null ? '' : s));
  const profilePill = (p, tightFlag) => {
    if (!p) return '<span class="prof-pill unc">' + '—' + '</span>';
    const isTight = tightFlag || TIGHT_PROFILES.has(p);
    const isProv = (p === 'Source Required' || p === 'DCMA');
    if (isProv) return '<span class="prof-pill prov">' + escHtml(p) + '</span>';
    if (isTight) return '<span class="prof-pill" style="background:var(--tint-red);color:var(--sig-red);border-color:var(--tintb-red)">' + escHtml(p) + '</span>';
    return '<span class="prof-pill">' + escHtml(p) + '</span>';
  };
  const flagPill = (flag, color) => {
    const c = color || FLAG_COLORS[flag] || '#8A8886';
    return '<span class="fc" style="background:' + c + '18;color:' + c + ';border:1px solid ' + c + '40">' + escHtml(flag) + '</span>';
  };
  const confPill = (conf) => {
    const labels = {confident:'Confident', caution:'Caution'};
    return '<span class="rs-conf-pill ' + (conf || 'confident') + '"><span class="dot"></span>' + (labels[conf]||conf||'Confident') + '</span>';
  };
  const riskChips = (risks) => (risks||[])
    .map(r => '<span class="rs-risk-chip ' + (r.severity==='severe'?'severe':'') + '">' + escHtml(r.label) + '</span>').join("");

  const detailHTML = (d) => {
    if (!d) return '';
    const indicators = (d.indicators || []).map(ind => {
      if (ind.active) return '<div class="rs-calc-line adjust"><div class="label">' + escHtml(ind.label) + '</div><div class="val">' + escHtml(ind.val || '+0 BD') + '</div></div>';
      return '<div class="rs-calc-line inactive"><div class="label">' + escHtml(ind.label) + '</div><div class="val">' + '—' + '</div></div>';
    }).join("");
    let maxLine = '';
    if (d.maxSlip != null) {
      maxLine = d.maxSlip > 0
        ? '<div class="rs-calc-line maxapp"><div>Max applied (not sum)</div><div class="val">+' + d.maxSlip + ' BD</div></div>'
        : '<div class="rs-calc-line maxapp"><div>No indicators firing</div><div class="val">+0 BD</div></div>';
    }
    const burnPct = (d.profileBurn != null) ? Math.round(d.profileBurn * 100) : null;
    const profSummary = (d.profileWindow != null)
      ? d.profileWindow + ' BD profile, ' + (d.profileElapsed != null ? d.profileElapsed : '?') + ' BD elapsed' + (burnPct!=null?' ('+burnPct+'% burned)':'')
      : 'Customer-controlled — no profile-burn math';
    return '<div class="rs-detail-inner"><div class="rs-detail-grid">'
      + '<div class="rs-detail-section"><h4>Inputs</h4>'
      + '<div class="rs-calc-line"><div>Profile / Burn</div><div class="val" style="font-size:11px">' + escHtml(profSummary) + '</div></div>'
      + '<div class="rs-calc-line"><div>Currently scheduled (QPC Due)</div><div class="val">' + escHtml(d.scheduled || '—') + '</div></div>'
      + '</div><div class="rs-detail-section"><h4>Risk indicators</h4>' + (indicators || '<div style="color:var(--text-muted);font-size:12px">No indicator data.</div>') + maxLine + '</div></div></div>';
  };

  const decideTodayCards = decideToday.map((j, i) => {
    const recPanel = j.recommendation === 'burn' ? 'left' : 'right';
    const bt = j.burnTarget || {};
    const co = j.commitOutcome || {};
    return '<div class="rs-urgent-card">'
      + '<div class="rs-urgent-hdr">'
      + '<span class="rs-urgent-deadline">DECIDE BY EOD TODAY</span>'
      + '<div><div style="display:flex;align-items:center;gap:10px"><span class="rs-urgent-wo">WO ' + escHtml(j.wo) + '</span><span class="rs-urgent-customer">' + escHtml(j.customer) + '</span></div>'
      + '<div style="display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap">' + profilePill(j.profile, j.profileCls==='tight') + flagPill(j.flag, j.flagColor) + '<span style="font-size:11px;color:var(--text-2)">· ' + escHtml(j.dept) + ' · Due ' + escHtml(j.dueDate) + ' (' + j.dueBD + ' BD)</span></div>'
      + '<div class="rs-risk-list">' + riskChips(j.risks) + '</div></div></div>'
      + '<div class="rs-urgent-body">'
      + '<div class="rs-urgent-option ' + (recPanel==='left'?'recommended':'') + '">'
      + (recPanel==='left'?'<span class="rs-urgent-option-tag rec">✓ Recommended</span>':'<span class="rs-urgent-option-tag alt">Option A</span>')
      + '<h4>Burn the reschedule</h4>'
      + '<div class="big">' + escHtml(bt.date || '—') + '</div>'
      + '<div class="small">' + escHtml(bt.band || '') + ' · ' + confPill(bt.confidence) + '</div>'
      + '<div class="small" style="margin-top:8px"><strong>Why:</strong> ' + escHtml(bt.reasoning || '') + '</div></div>'
      + '<div class="rs-urgent-option ' + (recPanel==='right'?'recommended':'') + '">'
      + (recPanel==='right'?'<span class="rs-urgent-option-tag rec">✓ Recommended</span>':'<span class="rs-urgent-option-tag alt">Option B</span>')
      + '<h4>Commit to current date</h4>'
      + '<div class="big bad">' + escHtml(co.miss || '—') + '</div>'
      + '<div class="small">Forecast still lands ' + escHtml(co.date || '—') + '</div>'
      + '<div class="small" style="margin-top:8px"><strong>Outcome:</strong> ' + escHtml(co.note || '') + '</div></div></div>'
      + '<div class="rs-urgent-foot"><span>Per Rule 2, reschedule must be made by EOD today.</span>'
      + '<a class="rs-show-math" onclick="rsToggleEl(\'rs-urgent-math-' + i + '\')">Show math →</a></div>'
      + '<div id="rs-urgent-math-' + i + '" style="display:none">' + detailHTML(j.detail) + '</div></div>';
  }).join("");

  const decideWeekRows = decideWeek.map((j, i) => {
    const t = j.target || {};
    return '<tr class="rs-expandable s' + (i%2) + '" onclick="rsToggleRow(this,\'rs-wk-' + i + '\')">'
      + '<td><span class="rs-row-toggle">+</span></td>'
      + '<td><span class="rs-action-pill burn">' + escHtml(j.actionLabel || 'Burn') + '</span></td>'
      + '<td><div class="rs-mini-wo">WO ' + escHtml(j.wo) + '</div>'
      + '<div class="rs-mini-cust">' + escHtml(j.customer) + '</div>'
      + '<div style="margin-top:4px">' + profilePill(j.profile, j.profileCls==='tight') + ' ' + flagPill(j.flag, j.flagColor) + '</div>'
      + '<div class="rs-risk-list">' + riskChips(j.risks) + '</div></td>'
      + '<td><div class="rs-deadline-cell"><div class="day">' + escHtml(j.deadlineDay || '—') + '</div>'
      + '<div class="bd ' + (j.deadlineBD!=null && j.deadlineBD<=1?'tight':'') + '">' + (j.deadlineBD != null ? j.deadlineBD : '—') + ' BD' + (j.deadlineNote?' · '+escHtml(j.deadlineNote):'') + '</div></div></td>'
      + '<td><div class="rs-target-cell"><div class="date">' + escHtml(t.date || '—') + '</div>'
      + '<div class="band">' + escHtml(t.band || '') + '</div>' + confPill(t.confidence) + '</div></td>'
      + '<td><div class="rs-tradeoff">' + escHtml(j.tradeoff || '') + '</div></td></tr>'
      + '<tr class="rs-detail-row" id="rs-wk-' + i + '" style="display:none"><td colspan="6">' + detailHTML(j.detail) + '</td></tr>';
  }).join("");

  const notifyRows = notify.map((j, i) => {
    const slipColor = (j.slipDays >= 5) ? '#A4262C' : '#7A6200';
    return '<tr class="rs-expandable s' + (i%2) + '" onclick="rsToggleRow(this,\'rs-nf-' + i + '\')">'
      + '<td><span class="rs-row-toggle">+</span></td>'
      + '<td><span class="rs-action-pill notify">Notify</span></td>'
      + '<td><div class="rs-mini-wo">WO ' + escHtml(j.wo) + '</div>'
      + '<div class="rs-mini-cust">' + escHtml(j.customer) + '</div>'
      + '<div style="margin-top:4px">' + profilePill(j.profile, j.profileCls==='tight') + ' ' + flagPill(j.flag, j.flagColor) + '</div>'
      + '<div class="rs-risk-list">' + riskChips(j.risks) + '</div></td>'
      + '<td><span class="mc" style="font-weight:700;color:' + slipColor + ';font-size:13px">' + escHtml(j.slip || '') + '</span></td>'
      + '<td><div class="rs-target-cell"><div class="date">' + escHtml(j.forecastDate || '—') + '</div>'
      + '<div class="band">scheduled: ' + escHtml(j.scheduledDue || '—') + '</div></div></td>'
      + '<td><div class="rs-tradeoff">' + escHtml(j.why || '') + '</div></td></tr>'
      + '<tr class="rs-detail-row" id="rs-nf-' + i + '" style="display:none"><td colspan="6">' + detailHTML(j.detail) + '</td></tr>';
  }).join("");

  const monitorRows = monitor.map((j, i) => {
    const deltaColor = j.delta === 'On time' ? '#0B6A0B' : '#7A6200';
    return '<tr class="rs-expandable s' + (i%2) + '" onclick="rsToggleRow(this,\'rs-mon-' + i + '\')">'
      + '<td><span class="rs-row-toggle">+</span></td>'
      + '<td><div class="rs-mini-wo">WO ' + escHtml(j.wo) + '</div>'
      + '<div class="rs-mini-cust">' + escHtml(j.customer) + '</div>'
      + '<div style="margin-top:4px">' + profilePill(j.profile, false) + '</div></td>'
      + '<td><span style="color:var(--text-2);font-weight:600">' + escHtml(j.dept) + '</span></td>'
      + '<td><span class="mc" style="font-weight:700;color:var(--text-strong)">' + escHtml(j.forecastDate || '—') + '</span></td>'
      + '<td><span class="mc" style="font-weight:700;color:' + deltaColor + '">' + escHtml(j.delta || '') + '</span></td>'
      + '<td><div style="font-size:11px;color:var(--text-2)">' + escHtml(j.note || '') + '</div></td></tr>'
      + '<tr class="rs-detail-row" id="rs-mon-' + i + '" style="display:none"><td colspan="6">' + detailHTML(j.detail) + '</td></tr>';
  }).join("");

  let html = '';

  if (reschedulePct >= 20) {
    html += '<div class="wb" style="background:var(--tint-red);border:1px solid var(--tintb-red);color:var(--sig-red);border-left:4px solid #D13438;border-radius:10px;margin-bottom:12px;padding:12px 16px"><strong>House buffer at ' + reschedulePct + '% — past the 20% threshold.</strong> All suggested targets below are best-case. Any further slip becomes a customer miss.</div>';
  }

  html += '<div class="rs-buffer-strip"><div>'
    + '<div class="buf-label">House Buffer</div>'
    + '<div style="display:flex;align-items:baseline;gap:8px">'
    + '<span class="buf-pct" style="color:' + buf_color + '">' + reschedulePct + '%</span>'
    + '<span class="buf-detail">' + rescheduledCount + ' of ' + totalInHouse + ' burned · ' + monitor.length + ' tracking on-time, ' + notify.length + ' slipping vs QPC Due</span></div></div>'
    + '<div class="gb"><div class="gbf" style="width:' + (Math.min(reschedulePct,40)/40*100) + '%;background:' + buf_color + '"></div>'
    + '<div class="gm" style="left:50%;background:#D13438"></div></div></div>';

  // Reschedule catalog: every in-house job that has moved its QPC Due, with
  // how many times - fed by the due-date-change audit trail (Stage History).
  html += (function () {
    const cat = (typeof TRENDS !== 'undefined' && TRENDS && TRENDS.reschedCatalog) ? TRENDS.reschedCatalog : null;
    if (!cat) return '';
    const inH = {}; (DATA.allInHouseJobs || []).forEach(j => inH[j.wo] = j);
    const month = (TRENDS.reschedMonth || 'this month');
    const rows = Object.keys(cat).map(wo => Object.assign({ wo, j: inH[wo] }, cat[wo]))
      .sort((a, b) => b.n - a.n || (b.last > a.last ? 1 : -1));
    // Status per the GM's OTD rule: will-call boxed = done; carrier boxed past
    // due = already counted late on the scorecard; shipped = gone.
    const rowStatus = r => {
      if (!r.j) return '<span style="color:var(--text-muted)">Shipped</span>';
      if (r.lateBox) return '<span style="color:var(--sig-red);font-weight:600">Boxed late · counted</span>';
      if (r.wc && r.box) return '<span style="color:var(--sig-green);font-weight:600">Boxed · done (will call)</span>';
      return escHtml(r.j.dept || '');
    };
    const rowDim = r => !r.j || (r.wc && r.box && !r.lateBox);
    const body = rows.map(r =>
      '<tr' + (rowDim(r) ? ' style="opacity:.65"' : '') + '><td style="font-weight:700;color:var(--text-strong)">WO ' + escHtml(r.wo) + '</td>'
      + '<td>' + escHtml(((r.j && r.j.customer) || r.cust || '').split(',')[0]) + '</td>'
      + '<td>' + rowStatus(r) + '</td>'
      + '<td class="c" style="font-weight:700;color:' + (r.n >= 3 ? 'var(--sig-red)' : r.n === 2 ? 'var(--sig-amber)' : 'var(--text-strong)') + '">' + r.n + '\u00d7</td>'
      + '<td class="c">' + (r.netDays > 0 ? '+' : '') + r.netDays + 'd</td>'
      + '<td class="c">' + escHtml(r.last || '') + '</td></tr>').join('');
    return '<div class="rs-section"><div class="rs-section-hdr s4"><span class="rs-section-dot s4"></span>'
      + '<div class="rs-section-title">Reschedule catalog \u2014 ' + escHtml(month) + '</div>'
      + '<div class="rs-section-count">' + rows.length + '</div>'
      + '<div class="rs-section-sub">Every job whose QPC Due moved this calendar month \u2014 times moved, net days pushed, last move. Status follows the OTD rule: will-call boxed = done; a carrier job boxed past due is already counted late (done rows dimmed)</div></div>'
      + (rows.length === 0
          ? '<div class="rs-empty">No QPC Due Date has moved yet in ' + escHtml(month) + '.</div>'
          : '<div class="card sw"><table class="t"><thead><tr><th>WO</th><th>Customer</th><th>Status</th><th class="c">Times moved</th><th class="c">Net push</th><th class="c">Last moved</th></tr></thead><tbody>' + body + '</tbody></table></div>')
      + '</div>';
  })();

  html += '<div class="rs-exceptions">'
    + '<div class="rs-exceptions-title"><span>Today\'s exceptions · ' + exception_total + ' job' + (exception_total===1?'':'s') + ' needing attention</span>'
    + '<span class="right">Click any tile to jump to that section</span></div>'
    + '<div class="rs-tile-grid">'
    + '<a class="rs-tile b1" href="#rs-sec-today"><div class="tc-num">' + decideToday.length + '</div><div class="tc-lbl">Decide today</div><div class="tc-sub">Reschedule window closes EOD</div></a>'
    + '<a class="rs-tile b2" href="#rs-sec-week"><div class="tc-num">' + decideWeek.length + '</div><div class="tc-lbl">Decide this week</div><div class="tc-sub">Eligible to reschedule</div></a>'
    + '<a class="rs-tile b3" href="#rs-sec-notify"><div class="tc-num">' + notify.length + '</div><div class="tc-lbl">Notify customer</div><div class="tc-sub">Burned and forecast past QPC Due</div></a>'
    + '<a class="rs-tile b4" href="#rs-sec-monitor"><div class="tc-num">' + monitor.length + '</div><div class="tc-lbl">Monitor</div><div class="tc-sub">Burned but tracking on or before QPC Due</div></a>'
    + '</div></div>';

  html += '<div class="rs-section" id="rs-sec-today">'
    + '<div class="rs-section-hdr s1"><span class="rs-section-dot s1"></span>'
    + '<div class="rs-section-title">Decide today</div>'
    + '<div class="rs-section-count">' + decideToday.length + '</div>'
    + '<div class="rs-section-sub">Rule 2: reschedule must be made ≥ 2 BD before due — window closes EOD</div></div>'
    + (decideToday.length === 0
        ? '<div class="rs-empty"><strong>No boundary cases today.</strong> All eligible jobs at the 2 BD boundary are forecast on-time, or have no risk indicators firing.</div>'
        : '<div>' + decideTodayCards + '</div>')
    + '</div>';

  html += '<div class="rs-section" id="rs-sec-week">'
    + '<div class="rs-section-hdr s2"><span class="rs-section-dot s2"></span>'
    + '<div class="rs-section-title">Decide this week</div>'
    + '<div class="rs-section-count">' + decideWeek.length + '</div>'
    + '<div class="rs-section-sub">Eligible to reschedule — deadline shown per row</div></div>'
    + (decideWeek.length === 0
        ? '<div class="rs-empty"><strong>No decisions queued for this week.</strong> All eligible jobs are forecast on-time vs. their current QPC Due.</div>'
        : '<div class="card"><table class="t"><thead><tr><th style="width:18px"></th><th>Action</th><th>WO / Customer</th><th>Decide By</th><th>Suggested Target</th><th>Trade-off</th></tr></thead><tbody>' + decideWeekRows + '</tbody></table></div>')
    + '</div>';

  html += '<div class="rs-section" id="rs-sec-notify">'
    + '<div class="rs-section-hdr s3"><span class="rs-section-dot s3"></span>'
    + '<div class="rs-section-title">Notify customer</div>'
    + '<div class="rs-section-count">' + notify.length + '</div>'
    + '<div class="rs-section-sub">Already burned — forecast lands past current QPC Due (any slip = OTD miss)</div></div>'
    + (notify.length === 0
        ? '<div class="rs-empty"><strong>No customer notifications recommended today.</strong> All burned jobs are forecast to land on or before their rescheduled QPC Due.</div>'
        : '<div class="card"><table class="t"><thead><tr><th style="width:18px"></th><th>Action</th><th>WO / Customer</th><th>Slip</th><th>Forecast Land</th><th>Why</th></tr></thead><tbody>' + notifyRows + '</tbody></table></div>')
    + '</div>';

  html += '<div class="rs-section" id="rs-sec-monitor">'
    + '<div class="rs-section-hdr s4"><span class="rs-section-dot s4"></span>'
    + '<div class="rs-section-title">Monitor</div>'
    + '<div class="rs-section-count">' + monitor.length + '</div>'
    + '<div class="rs-section-sub">Burned but tracking on or before current QPC Due — no action needed</div></div>'
    + (monitor.length === 0
        ? '<div class="rs-empty">No burned-but-tracking jobs.</div>'
        : '<div id="rs-mon-toggle" class="rs-collapse-toggle" onclick="rsToggleMonitor()"><span class="chev">▶</span><span class="ct-text">Show ' + monitor.length + ' burned-but-tracking job' + (monitor.length===1?'':'s') + '</span></div>'
          + '<div id="rs-mon-panel" style="display:none;margin-top:10px"><div class="card"><table class="t"><thead><tr><th style="width:18px"></th><th>WO / Customer</th><th>Dept</th><th>Forecast</th><th>vs. Scheduled</th><th>Note</th></tr></thead><tbody>' + monitorRows + '</tbody></table></div></div>')
    + '</div>';

  html += '<div class="rs-explainer">'
    + '<div id="rs-expl-toggle" class="rs-explainer-toggle" onclick="rsToggleExplainer()"><span class="chev">▶</span><span style="font-size:12px;font-weight:700;color:var(--text-2)">How recommendations are generated · QPC reschedule rules · arithmetic</span></div>'
    + '<div id="rs-expl-content" class="rs-explainer-content">'
    + '<h3>OTD-strict (98% KPI) framing</h3>'
    + '<p>The 98% OTD KPI is measured against the <strong>current QPC Due Date</strong>, which moves when a reschedule is burned. Burning a reschedule is the tool that protects OTD: move the internal commitment to a date you can hit, then measure against that.</p>'
    + '<h3>Default-to-scheduled, slip-on-indicator</h3>'
    + '<p>Forecast = current QPC Due Date by default. Slip is added only when specific risk indicators fire. Multiple indicators take the <strong>maximum</strong>, not the sum.</p>'
    + '</div></div>';

  html += '<div class="biz-note">All times Pacific. Mon–Fri biz days, 7:00a–3:30p.</div>';

  return html;
}

// ─── Toggle helpers (Reschedule Status v12) ───
function rsToggleRow(tr, id) {
  const detail = document.getElementById(id);
  if (!detail) return;
  const open = detail.style.display === 'table-row';
  detail.style.display = open ? 'none' : 'table-row';
  if (tr) tr.classList.toggle('open', !open);
}
function rsToggleEl(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}
function rsToggleMonitor() {
  const t = document.getElementById('rs-mon-toggle');
  const p = document.getElementById('rs-mon-panel');
  if (!t || !p) return;
  const open = p.style.display === 'block';
  p.style.display = open ? 'none' : 'block';
  t.classList.toggle('open', !open);
}
function rsToggleExplainer() {
  const t = document.getElementById('rs-expl-toggle');
  const c = document.getElementById('rs-expl-content');
  if (!t || !c) return;
  c.classList.toggle('open');
  t.classList.toggle('open');
}

let modalState = { kpi: null, deptFilter: 'All' };

// Sort jobs by soonest QPC Due Date first (null dates pushed to the end).
// dueBD is the canonical ordering key (biz days to QPC Due Date); it's monotonic
// with the actual calendar date on Mon-Fri.
function sortByDueDate(jobs) {
  return jobs.slice().sort((a, b) => {
    const ab = a.dueBD, bb = b.dueBD;
    if (ab == null && bb == null) return 0;
    if (ab == null) return 1;   // "No Date" -> end
    if (bb == null) return -1;
    return ab - bb;
  });
}

function _deptOf(j) { return j.dept || j.locationDept || ''; }

function openKpiModal(kpi) {
  if (!KPI_CONFIGS[kpi]) return;
  modalState = { kpi, deptFilter: 'All' };
  renderModal();
  const el = document.getElementById('kpi-modal');
  el.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeKpiModal() {
  const el = document.getElementById('kpi-modal');
  el.classList.remove('open');
  el.innerHTML = '';
  document.body.style.overflow = '';
  modalState = { kpi: null, deptFilter: 'All' };
}

function setModalDeptFilter(d) {
  modalState.deptFilter = d;
  renderModal();
}

function renderModal() {
  const { kpi, deptFilter } = modalState;
  const cfg = KPI_CONFIGS[kpi];
  if (!cfg) return;
  const full = cfg.source();
  const allDepts = Array.from(new Set(full.map(_deptOf).filter(Boolean))).sort();
  let jobs = full;
  if (deptFilter !== 'All') jobs = jobs.filter(j => _deptOf(j) === deptFilter);
  jobs = sortByDueDate(jobs);

  const deptCtrl = (allDepts.length > 1)
    ? `<span class="modal-ctrl-label">Filter Dept</span>
       <select class="modal-ctrl-sel" onchange="setModalDeptFilter(this.value)" aria-label="Filter by department">
         <option value="All">All Departments (${full.length})</option>
         ${allDepts.map(d => {
           const ct = full.filter(j => _deptOf(j) === d).length;
           return `<option value="${esc(d)}"${deptFilter===d?' selected':''}>${esc(d)} (${ct})</option>`;
         }).join('')}
       </select>`
    : `<span class="modal-ctrl-label">Dept</span><span style="font-size:12px;color:var(--text-2);font-weight:600">${allDepts[0] || '—'}</span>`;

  const body = jobs.length
    ? buildModalTable(jobs, cfg.variant)
    : `<div class="modal-empty">No jobs match this filter.</div>`;

  const subtitle = cfg.subtitle ? cfg.subtitle() : '';

  document.getElementById('kpi-modal').innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-hdr">
        <div>
          <div class="modal-title" id="kpi-modal-title">${esc(cfg.title)}</div>
          ${subtitle ? `<div style="font-size:11px;color:var(--text-muted);margin-top:2px">${esc(subtitle)}</div>` : ''}
        </div>
        <div class="modal-count">${jobs.length}${jobs.length !== full.length ? ' / ' + full.length : ''}</div>
        <button class="modal-close" onclick="closeKpiModal()" title="Close (Esc)" aria-label="Close">✕</button>
      </div>
      <div class="modal-controls">${deptCtrl}
        <span class="modal-ctrl-label" style="margin-left:auto">Sorted by earliest QPC Due Date</span>
      </div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">
        <span>Click outside, tap ✕, or press Esc to close.</span>
        <span>v11 — Drill-down powered by live extraction data.</span>
      </div>
    </div>`;
}

// Build an HTML table of jobs. Column set varies by variant, but the core
// columns (Due, WO, Customer, Dept, Profile, Priority, Status) are consistent.
function buildModalTable(jobs, variant) {
  // Column spec per variant. Each spec is a list of {h: header, c: (job)=>html}.
  const col = {
    due:     { h: 'Due',      c: (j) => {
                 const bd = j.dueBD;
                 const c = bd != null && bd < 0 ? '#D13438' : bd != null && bd <= 2 ? 'var(--acc-orange)' : '#605E5C';
                 const bdTxt = bd != null ? ` <span style="color:${c};font-size:10px;font-weight:700">(${bd}d)</span>` : '';
                 return `<span class="mc" style="color:var(--text-2)">${esc(j.dueDate || '—')}${bdTxt}</span>`;
              }},
    wo:      { h: 'WO',       c: (j) => `<span class="mc" style="font-weight:700;color:var(--text-strong)">${esc(j.wo)}</span>` },
    cust:    { h: 'Customer', c: (j) => `<span style="max-width:180px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);vertical-align:middle">${esc(j.customer || '—')}</span>` },
    dept:    { h: 'Dept',     c: (j) => `<span style="color:var(--text);font-weight:600;font-size:12px">${esc(_deptOf(j))}</span>` },
    profile: { h: 'Profile',  c: (j) => profilePill(j) },
    prio:    { h: 'Priority', c: (j) => j.priority ? `<span style="${prioStyle(j.priority)}">${esc(j.priority)}</span>` : '<span class="status-none">—</span>' },
    flag:    { h: 'Flag',     c: (j) => {
                 if (!j.flag) return '<span class="status-none">—</span>';
                 return `<span class="status-pill" style="background:${FLAG_COLORS[j.flag]}18;color:${FLAG_COLORS[j.flag]};border:1px solid ${FLAG_COLORS[j.flag]}40">${esc(j.flag)}</span>`;
              }},
    resched: { h: 'Resched',  c: (j) => j.rescheduled ? '<span style="color:#D13438;font-weight:700;font-size:10px">BURNED</span>' : '<span class="status-none">—</span>' },
    status:  { h: 'Status',   c: (j) => buildStatusCell(j, variant) },
    startBy: { h: 'Start By', c: (j) => {
                 const bd = j.msBD;
                 const lbl = bd == null ? '—' : bd <= 0 ? 'START NOW' : bd === 1 ? 'TOMORROW' : `${bd}d`;
                 const c = bd != null && bd <= 0 ? '#D13438' : bd === 1 ? 'var(--acc-orange)' : 'var(--acc-blue)';
                 return `<span class="mc" style="color:${c}">${esc(j.msDate || '—')} <span style="font-size:9px;font-weight:700">${lbl}</span></span>`;
              }},
    aging:   { h: 'Aging?',   c: (j) => j.isAging
                 ? '<span class="status-pill status-aging">AGING</span>'
                 : '<span class="status-none">no</span>' },
    short:   { h: 'Short By', c: (j) => `<span class="mc" style="color:#D13438;font-weight:700">−${j.shortfall}d</span> <span style="font-size:10px;color:var(--text-muted)">(window ${j.profileMin}–${j.profileMax}d, lead ${j.scheduledLeadBD}d)</span>` },
    location:{ h: 'Location', c: (j) => `<span style="color:var(--text-2);font-size:12px">${esc(j.locationDept || '—')}</span>` },
  };

  let cols;
  if (variant === 'aging') {
    cols = ['due','wo','cust','dept','profile','prio','flag','resched'];
  } else if (variant === 'inhouse') {
    cols = ['due','wo','cust','dept','profile','prio','status'];
  } else if (variant === 'upcoming') {
    cols = ['due','wo','dept','profile','startBy','prio'];
  } else if (variant === 'mrb') {
    cols = ['due','wo','cust','location','profile','prio'];
  } else if (variant === 'short') {
    cols = ['due','wo','cust','dept','profile','short','prio','aging'];
  } else if (variant === 'custHold') {
    cols = ['due','wo','cust','location','profile','prio'];
  } else if (variant === 'completed') {
    cols = ['due','wo','cust','dept','profile','prio','status'];
  } else {
    cols = ['due','wo','cust','dept','profile','prio'];
  }

  const thead = cols.map(k => `<th${(k==='due'||k==='short'||k==='startBy')?' class="r"':''}>${col[k].h}</th>`).join('');
  const rows = jobs.map((j, i) => {
    const tds = cols.map(k => `<td${(k==='due'||k==='short'||k==='startBy')?' class="r"':''}>${col[k].c(j)}</td>`).join('');
    return `<tr class="${i%2===0?'s0':'s1'}">${tds}</tr>`;
  }).join('');
  return `<table class="t"><thead><tr>${thead}</tr></thead><tbody>${rows}</tbody></table>`;
}

// Compose a status/context cell per variant (used by `status` column).
function buildStatusCell(j, variant) {
  if (variant === 'inhouse') {
    const bits = [];
    if (j.isAging && j.agingFlag) bits.push(`<span class="status-pill" style="background:${FLAG_COLORS[j.agingFlag]}18;color:${FLAG_COLORS[j.agingFlag]};border:1px solid ${FLAG_COLORS[j.agingFlag]}40">${esc(j.agingFlag)}</span>`);
    else if (j.isAging) bits.push('<span class="status-pill status-aging">AGING</span>');
    if (j.isCompleted) bits.push('<span class="status-pill status-complete">03 - Complete</span>');
    if (j.expediteTier) bits.push(`<span class="tier-badge">${j.expediteTier.replace('Tier ','T').replace(' Expedite','')}</span>`);
    if (!bits.length) bits.push('<span class="status-none">in flow</span>');
    return bits.join(' ');
  }
  if (variant === 'completed') {
    return `<span class="status-pill status-complete">03 - Complete</span> <span style="color:var(--text-muted);font-size:10px">at ${esc(j.locationDept || '—')}</span>`;
  }
  return '<span class="status-none">—</span>';
}

// ─── TAB 5: TRENDS — the story of how work is moving ───
// Order = the meeting's questions: Is today normal? → Who's drifting? →
// Which jobs keep coming back / where do they sit? → The season (evidence).
const TR_ACC = "var(--acc-blue)";   // single accent for history marks (CVD-validated both themes)

function trFmtDay(d) { return (+d.slice(5, 7)) + "/" + (+d.slice(8, 10)); }
function trFmtH(h) { return h == null ? "n/a" : (h >= 2 ? Math.round(h) + "h" : Math.round(h * 60) + "m"); }
function trNice(mx) {
  if (mx <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(mx)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= mx) return m * p;
  return 10 * p;
}

// 30-day AR sparkline: 1.5px line, GREEN threshold as the only reference
function trSpark(spark, W, H) {
  const pts = spark.filter(s => s.ar != null);
  if (!pts.length) return "";
  const mx = Math.max(14, ...pts.map(s => s.ar)) * 1.1;
  const x = i => 2 + (i / Math.max(1, spark.length - 1)) * (W - 4);
  const y = v => H - 3 - (v / mx) * (H - 6);
  let d = "", pen = "M";
  spark.forEach((s, i) => {
    if (s.ar == null) { pen = "M"; return; }
    d += `${pen}${x(i).toFixed(1)} ${y(s.ar).toFixed(1)}`; pen = "L";
  });
  const yG = y(12);
  const last = pts[pts.length - 1];
  const lastI = spark.lastIndexOf(last);
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
    <line x1="2" y1="${yG}" x2="${W - 2}" y2="${yG}" stroke="var(--sig-green)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
    <path d="${d}" fill="none" stroke="${TR_ACC}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${x(lastI)}" cy="${y(last.ar)}" r="2.4" fill="${TR_ACC}"/></svg>`;
}

// Season chart: daily AR vs signal thresholds (the one full chart that survives)
function trSeason(ar, W, H) {
  const mL = 34, mR = 8, mT = 12, mB = 20, pW = W - mL - mR, pH = H - mT - mB;
  const yMax = Math.max(25, trNice(Math.max(...ar.map(r => r.ar)) * 1.1));
  const y = v => mT + pH - (v / yMax) * pH;
  const x = i => mL + (i / Math.max(1, ar.length - 1)) * pW;
  let s = "";
  [0, yMax / 2, yMax].forEach(v => {
    s += `<line x1="${mL}" y1="${y(v)}" x2="${mL + pW}" y2="${y(v)}" stroke="var(--border)" stroke-width="1"/>`
       + `<text x="${mL - 5}" y="${y(v) + 3.5}" text-anchor="end" class="tr-tick">${v}%</text>`;
  });
  [{ v: 12, c: "var(--sig-green)", l: "GREEN ≤12%" }, { v: 20, c: "var(--sig-amber)", l: "YELLOW ≤20%" }, { v: 35, c: "var(--sig-red)", l: "RED ≤35%" }]
    .forEach(t => { if (t.v < yMax) s += `<line x1="${mL}" y1="${y(t.v)}" x2="${mL + pW}" y2="${y(t.v)}" stroke="${t.c}" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/><text x="${mL + pW}" y="${y(t.v) - 3}" text-anchor="end" class="tr-thr" fill="${t.c}">${t.l}</text>`; });
  let d = "M";
  ar.forEach((r, i) => { d += `${i ? "L" : ""}${x(i).toFixed(1)} ${y(r.ar).toFixed(1)}`; });
  s += `<path d="${d}" fill="none" stroke="${TR_ACC}" stroke-width="2" stroke-linejoin="round"/>`;
  ar.forEach((r, i) => {
    s += `<g data-tip="${trFmtDay(r.date)} — AR ${r.ar}% (${r.aging} aging / ${r.inHouse} in house)"><circle cx="${x(i)}" cy="${y(r.ar)}" r="9" fill="transparent"/><circle cx="${x(i)}" cy="${y(r.ar)}" r="2" fill="${TR_ACC}"/></g>`;
    if (i % 10 === 0 || i === ar.length - 1) s += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle" class="tr-tick">${trFmtDay(r.date)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily house aging ratio vs signal thresholds">${s}</svg>`;
}

// Month over month: is this month better than last? Four months side by side,
// deltas on the current month, colored by whether the move is good for us.
function buildMonthly() {
  const M = (TRENDS && TRENDS.monthly) ? TRENDS.monthly.filter(m => m.marks || m.shipped || m.avgAr != null) : [];
  if (M.length < 2) return '';
  const cur = M[M.length - 1], prev = M[M.length - 2];
  const fmtH = v => v == null ? '—' : (v >= 2 ? Math.round(v) + 'h' : Math.round(v * 60) + 'm');
  const cell = (v, suf, dag) => v == null ? '—' : v + (suf || '') + (dag ? '†' : '');
  // goodWhen: 'up' | 'down' | null(neutral)
  const ROWS = [
    { name: 'Shipped on time (OTD)', get: m => m.otdPct, fmt: m => cell(m.otdPct, '%'), goodWhen: 'up', eps: 0.5 },
    { name: 'Jobs shipped', get: m => m.shipped, fmt: m => cell(m.shipped), goodWhen: null, eps: 0 },
    { name: 'Went stale (marked aging)', get: m => m.marks, fmt: m => cell(m.marks, '', m.partial), goodWhen: 'down', eps: 3 },
    { name: 'Pickup speed (median)', get: m => m.recovHrs, fmt: m => (m.recovHrs == null ? '—' : fmtH(m.recovHrs) + (m.partial ? '†' : '')), goodWhen: 'down', eps: 1.5 },
    { name: 'Avg house AR', get: m => m.avgAr, fmt: m => cell(m.avgAr, '%'), goodWhen: 'down', eps: 1 },
    { name: 'Due dates moved', get: m => m.resched, fmt: m => cell(m.resched), goodWhen: 'down', eps: 3 },
  ];
  const delta = r => {
    const a = r.get(prev), b = r.get(cur);
    if (a == null || b == null) return '<span class="tr-delta mut">—</span>';
    const d = b - a;
    if (Math.abs(d) <= r.eps) return '<span class="tr-delta mut">→ steady</span>';
    if (!r.goodWhen) return `<span class="tr-delta mut">${d > 0 ? '▲' : '▼'} ${Math.abs(Math.round(d * 10) / 10)}</span>`;
    const good = (d < 0) === (r.goodWhen === 'down');
    const mag = r.name.includes('Pickup') ? fmtH(Math.abs(d)) : Math.abs(Math.round(d * 10) / 10);
    return `<span class="tr-delta ${good ? 'good' : 'bad'}">${d > 0 ? '▲' : '▼'} ${mag} ${good ? 'better' : 'worse'}</span>`;
  };
  const head = M.map(m => `<th class="c${m.mtd ? ' cur' : ''}">${esc(m.label)}${m.mtd ? '<span class="tr-mtd"> · so far</span>' : ''}</th>`).join('');
  const body = ROWS.map(r =>
    `<tr><td class="tr-metric">${esc(r.name)}</td>`
    + M.map(m => `<td class="c${m.mtd ? ' cur' : ''}">${r.fmt(m)}</td>`).join('')
    + `<td class="c">${delta(r)}</td></tr>`).join('');
  return `
  <div class="tr-sec">
    <h2>Month over month — are we better than ${esc(prev.label)}?</h2>
    <div class="tr-card" style="overflow-x:auto;">
      <table class="tr-table tr-mo"><thead><tr><th></th>${head}<th class="c">vs ${esc(prev.label)}</th></tr></thead>
      <tbody>${body}</tbody></table>
    </div>
  </div>`;
}

function buildTrends() {
  if (!TRENDS || !TRENDS.pulse) {
    return `<div class="card" style="padding:24px;color:var(--text-2)">Trend history not available for this build.</div>`;
  }
  const P = TRENDS.pulse;
  const vcol = v => v === "BETTER" ? "var(--sig-green)" : v === "WORSE" ? "var(--sig-red)" : "var(--text-2)";
  const vlbl = v => v === "BETTER" ? "BETTER than usual" : v === "WORSE" ? "WORSE than usual" : v === "NORMAL" ? "NORMAL" : "NO DATA";
  const dagger = P.respPartialCapture ? "†" : "";

  const tile = (num, unit, cap, norm, verdict) => `
    <div class="tr-tile">
      <div class="tr-tile-num">${num}<span class="tr-tile-unit">${unit}</span></div>
      <div class="tr-tile-cap">${cap}</div>
      <div class="tr-tile-norm">${norm}</div>
      <div class="tr-tile-verdict" style="color:${vcol(verdict)}">${vlbl(verdict)}</div>
    </div>`;

  // — 2. departments, floor order first, customer-clock grouped after —
  const leadOf = {}; DATA.departments.forEach(d => leadOf[d.name] = d.lead || "");
  const arNow = {}; DATA.departments.forEach(d => arNow[d.name] = d.ar);
  const trendGlyph = t => t === "improving" ? ["▼", "var(--sig-green)"] : t === "worsening" ? ["▲", "var(--sig-red)"] : ["→", "var(--text-muted)"];
  const deptRow = c => {
    const [g, gc] = trendGlyph(c.trend);
    const ar = arNow[c.dept];
    const tierInfo = (ar == null) ? { color: "var(--surface-3)", ink: "var(--text-2)" } : getTier(ar);
    return `<div class="tr-dept-row">
      <div class="tr-dept-name">${esc(c.dept === "Receiving/Inspection" ? "RI" : c.dept)}<span class="tr-dept-lead">${esc(leadOf[c.dept] || "")}</span></div>
      <div class="tr-dept-chip" style="background:${tierInfo.color}22;color:${tierInfo.ink}">${ar == null ? "—" : ar + "%"}</div>
      <div class="tr-dept-spark">${trSpark(c.spark, 120, 26)}</div>
      <div class="tr-dept-glyph" style="color:${c.custClock ? "var(--text-muted)" : gc}">${c.custClock ? "◷" : g}</div>
      <div class="tr-dept-sent">${esc(c.sentence)}</div>
    </div>`;
  };
  const floorCards = TRENDS.deptCards.filter(c => !c.custClock);
  const custCards = TRENDS.deptCards.filter(c => c.custClock);

  // — 3a. repeat offenders currently in house —
  const inHouse = {}; (DATA.allInHouseJobs || []).forEach(j => inHouse[j.wo] = j);
  const agingNow = {}; (DATA.allAgingJobs || []).forEach(j => agingNow[j.wo] = j);
  let offenders = (TRENDS.repeatAgers60d || [])
    .map(([wo, n]) => ({ wo, n, j: inHouse[wo] })).filter(o => o.j).slice(0, 10);
  let offCaption = "In house right now and aged 2+ times in 60 days — get ahead of these:";
  if (!offenders.length && TRENDS.agers60d) {
    // no chronic offender on the floor - fall back to anything in house that has aged at all
    offenders = Object.entries(TRENDS.agers60d)
      .map(([wo, n]) => ({ wo, n, j: inHouse[wo] })).filter(o => o.j)
      .sort((a, b) => b.n - a.n).slice(0, 10);
    offCaption = "No chronic (2+×) repeat agers on the floor — these in-house jobs have aged before:";
  }
  const offRows = offenders.map(o => {
    const ag = agingNow[o.wo];
    const flag = ag ? `<span class="tr-flag" style="background:${(FLAG_COLORS[ag.flag] || "#888")}22;color:${FLAG_COLORS[ag.flag] || "var(--text-2)"}">${esc(ag.flag)}</span>`
                    : `<span class="tr-flag" style="color:var(--text-muted)">in flow</span>`;
    return `<tr><td class="tr-wo">${esc(o.wo)}</td><td>${esc((o.j.customer || "").split(",")[0])}</td><td>${esc(o.j.dept || "")}</td><td class="tr-n">${o.n}× aged</td><td>${flag}</td></tr>`;
  }).join("");

  // — 3b. response time by department (floor depts, lead named) —
  const resp = TRENDS.deptCards.filter(c => c.respH != null && !c.custClock);
  const rMax = Math.max(1, ...resp.map(c => c.respH));
  const respRows = resp.sort((a, b) => b.respH - a.respH).map(c => `
    <div class="tr-resp-row" data-tip="${esc(c.dept)} — median ${trFmtH(c.respH)} from aging flag to pickup (30d)">
      <div class="tr-resp-name">${esc(c.dept === "Receiving/Inspection" ? "RI" : c.dept)}<span class="tr-dept-lead">${esc(leadOf[c.dept] || "")}</span></div>
      <div class="tr-resp-track"><div class="tr-resp-bar" style="width:${Math.max(4, 100 * c.respH / rMax)}%"></div></div>
      <div class="tr-resp-val">${trFmtH(c.respH)}${dagger}</div>
    </div>`).join("");

  const foot = TRENDS.realProgressCutoff
    ? `<div class="tr-note">† Response times after ${esc(TRENDS.realProgressCutoff.slice(0, 10))} are measured at pipeline cadence (~2h), not exact touch times — the source flow stopped logging Progress events that day. Numbers tighten automatically as new capture accumulates.</div>`
    : "";

  return `
  <style>
    .tr-sec{margin-bottom:14px;}
    .tr-sec h2{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px 2px;}
    .tr-hero{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;font-size:13px;line-height:1.55;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.05);}
    .tr-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px;}
    .tr-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
    .tr-tile-num{font-size:28px;font-weight:700;color:var(--text-strong);line-height:1.1;}
    .tr-tile-unit{font-size:13px;font-weight:600;color:var(--text-muted);margin-left:2px;}
    .tr-tile-cap{font-size:12px;color:var(--text-2);margin-top:2px;}
    .tr-tile-norm{font-size:11px;color:var(--text-muted);margin-top:1px;}
    .tr-tile-verdict{font-size:11px;font-weight:700;letter-spacing:.3px;margin-top:6px;}
    .tr-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
    .tr-dept-row{display:grid;grid-template-columns:150px 52px 128px 22px 1fr;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--border);}
    .tr-dept-row:first-child{border-top:none;}
    .tr-dept-name{font-size:13px;font-weight:600;color:var(--text-strong);}
    .tr-dept-lead{display:block;font-size:10.5px;font-weight:400;color:var(--text-muted);}
    .tr-dept-chip{font-size:12px;font-weight:700;text-align:center;border-radius:8px;padding:4px 0;}
    .tr-dept-glyph{font-size:13px;font-weight:700;text-align:center;}
    .tr-dept-sent{font-size:12px;color:var(--text-2);line-height:1.4;}
    .tr-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;}
    .tr-table{width:100%;border-collapse:collapse;font-size:12px;}
    .tr-table td{padding:6px 8px;border-top:1px solid var(--border);color:var(--text);}
    .tr-table tr:first-child td{border-top:none;}
    .tr-wo{font-weight:700;color:var(--text-strong);}
    .tr-n{font-weight:700;color:var(--acc-orange);white-space:nowrap;}
    .tr-flag{font-size:10.5px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap;}
    .tr-resp-row{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;padding:6px 2px;}
    .tr-resp-track{background:var(--surface-2);border-radius:5px;height:10px;overflow:hidden;}
    .tr-resp-bar{background:${TR_ACC};height:100%;border-radius:5px;}
    .tr-resp-name{font-size:13px;font-weight:600;color:var(--text-strong);}
    .tr-resp-val{font-size:12px;font-weight:700;color:var(--text-strong);text-align:right;}
    .tr-tick{font-size:9.5px;fill:var(--text-muted);}
    .tr-thr{font-size:9px;font-weight:600;}
    .tr-note{font-size:10.5px;color:var(--text-muted);margin-top:10px;line-height:1.45;}
    .tr-season summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--text-2);padding:10px 16px;}
    #trend-tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);color:var(--text);font-size:12px;padding:6px 10px;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:60;display:none;max-width:280px;}
    .tr-mo{min-width:520px;}
    .tr-mo th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:6px 8px;text-align:left;}
    .tr-mo th.c,.tr-mo td.c{text-align:center;}
    .tr-mo td{font-variant-numeric:tabular-nums;}
    .tr-mo .cur{background:var(--surface-2);font-weight:700;color:var(--text-strong);}
    .tr-mo th.cur{border-radius:8px 8px 0 0;}
    .tr-mtd{font-weight:400;letter-spacing:0;text-transform:none;color:var(--text-faint);}
    .tr-metric{color:var(--text-2);font-weight:600;white-space:nowrap;}
    .tr-delta{font-size:11px;font-weight:700;white-space:nowrap;}
    .tr-delta.good{color:var(--sig-green);}
    .tr-delta.bad{color:var(--sig-red);}
    .tr-delta.mut{color:var(--text-muted);font-weight:600;}
    @media (max-width:700px){
      .tr-dept-row{grid-template-columns:1fr 56px 22px;grid-template-areas:"name chip glyph" "spark spark spark" "sent sent sent";row-gap:6px;}
      .tr-dept-name{grid-area:name;}.tr-dept-chip{grid-area:chip;}.tr-dept-glyph{grid-area:glyph;}
      .tr-dept-spark{grid-area:spark;}.tr-dept-spark svg{width:100%;height:30px;}
      .tr-dept-sent{grid-area:sent;}
      .tr-resp-row{grid-template-columns:104px 1fr 48px;}
    }
  </style>

  <div class="tr-sec">
    <div class="tr-hero">${esc(TRENDS.hero)}${dagger}</div>
    <div class="tr-tiles">
      ${tile(P.agingToday, "", "aging in house today", "typical: ~" + Math.round(P.agingNorm), P.agingVerdict)}
      ${tile(P.staleThisWeek, "", "jobs went stale this week", "norm: ~" + P.staleNorm + "/wk", P.staleVerdict)}
      ${tile(trFmtH(P.respThisWeekH), dagger, "median time to pick up an aging job", "norm: " + trFmtH(P.respNormH), P.respVerdict)}
    </div>
  </div>

  ${buildMonthly()}

  <div class="tr-sec">
    <h2>Departments — last 30 days, who's drifting</h2>
    <div class="tr-card">
      ${floorCards.map(deptRow).join("")}
      ${custCards.length ? `<div style="font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--text-muted);padding:8px 2px 2px;border-top:1px solid var(--border);">CUSTOMER CLOCK</div>` + custCards.map(deptRow).join("") : ""}
    </div>
  </div>

  <div class="tr-sec">
    <h2>The floor — repeat offenders &amp; pickup speed</h2>
    <div class="tr-two">
      <div class="tr-card">
        <div style="font-size:12px;color:var(--text-2);margin-bottom:6px;">${offCaption}</div>
        <table class="tr-table"><tbody>${offRows || `<tr><td style="color:var(--text-muted)">Nothing in house has aged in the last 60 days.</td></tr>`}</tbody></table>
      </div>
      <div class="tr-card">
        <div style="font-size:12px;color:var(--text-2);margin-bottom:6px;">When a job goes stale, how long until someone touches it (median, 30d):</div>
        ${respRows || `<div style="font-size:12px;color:var(--text-muted)">Not enough recoveries to measure yet.</div>`}
      </div>
    </div>
  </div>

  <details class="tr-card tr-season tr-sec">
    <summary>The season — daily house AR vs signal thresholds (${TRENDS.arDaily.length} days)</summary>
    <div style="padding:0 16px 12px;">${trSeason(TRENDS.arDaily, 720, 220)}</div>
  </details>
  ${foot}
  <div id="trend-tip"></div>`;
}

function initTrendTips() {
  const root = document.getElementById("tab3");
  const tip = () => document.getElementById("trend-tip");
  root.addEventListener("mousemove", e => {
    const g = e.target.closest("[data-tip]");
    const t = tip();
    if (!g) { t.style.display = "none"; return; }
    t.textContent = g.getAttribute("data-tip");
    t.style.display = "block";
    t.style.left = Math.min(e.clientX + 14, window.innerWidth - t.offsetWidth - 8) + "px";
    t.style.top = (e.clientY + 16) + "px";
  });
  root.addEventListener("mouseleave", () => { tip().style.display = "none"; });
}

// ─── FRESHNESS CHECK ───
// GitHub Pages caches this page ~10 min on devices. Poll our own URL's build
// stamp (tiny Range request); when a newer build is live, offer one-tap reload.
(function initFreshness() {
  const chip = document.createElement('div');
  chip.id = 'fresh-chip';
  chip.setAttribute('role', 'button');
  chip.setAttribute('tabindex', '0');
  chip.textContent = '⟳ Newer data available — tap to refresh';
  const reload = () => location.replace(location.pathname + '?r=' + Date.now());
  chip.addEventListener('click', reload);
  chip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reload(); } });
  document.body.appendChild(chip);
  let shown = false;
  async function check() {
    if (shown || location.protocol === 'file:') return;
    try {
      const resp = await fetch(location.pathname + '?fc=' + Date.now(), {
        cache: 'no-store', headers: { 'Range': 'bytes=0-2047' } });
      const head = await resp.text();
      const m = head.match(/name="qpc-build" content="([^"]+)"/);
      if (m && m[1] && m[1] !== GENERATED_TIME) {
        chip.classList.add('show');
        shown = true;
      }
    } catch (e) { /* offline or blocked - stay quiet */ }
  }
  setTimeout(check, 20000);                 // shortly after load
  setInterval(check, 5 * 60 * 1000);        // every 5 minutes
  document.addEventListener('visibilitychange', () => {   // returning to the tab
    if (document.visibilityState === 'visible') check();
  });
})();
