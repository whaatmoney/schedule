<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="qpc-build" content="04:00 PM PDT">
  <title>QPC Production Pulse — 07/26/2026</title>
  <style>
/* ===== THEME TOKENS ===== */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F4F6F9; --surface-3:#E7EBF0;
  --border:#DCE1E8; --border-strong:#C2C9D4;
  --text-strong:#0F1722; --text:#1E2733; --text-2:#5A6675; --text-muted:#8A94A3; --text-faint:#AAB2BF;
  --sig-black:#1A1A1A; --sig-green:#0B6A0B; --sig-amber:#946C00; --sig-red:#B3261E;
  --tint-green:#DCF3DC; --tint-amber:#FBEFC6; --tint-orange:#FCE6D4; --tint-red:#FADDDE; --tint-purple:#ECE3F8; --tint-blue:#DCEBFB;
  --tintb-green:#A9E2A6; --tintb-amber:#EBD08A; --tintb-orange:#F0B98A; --tintb-red:#EFB3B5; --tintb-purple:#D6C5EC; --tintb-blue:#B9D8F5;
  --kpiv-text-mix:0%;
  --acc-blue:#0078D4; --acc-purple:#8764B8; --acc-orange:#CA5010;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0C1015; --surface:#151B23; --surface-2:#1B222C; --surface-3:#232C38;
  --border:#2A333F; --border-strong:#3A4654;
  --text-strong:#F2F6FB; --text:#DCE3EC; --text-2:#A7B2C0; --text-muted:#7E8B9B; --text-faint:#5F6B7A;
  --sig-black:#E9EEF5; --sig-green:#56D364; --sig-amber:#E3B341; --sig-red:#FF6B6E;
  --tint-green:rgba(46,160,67,.20); --tint-amber:rgba(210,153,34,.20); --tint-orange:rgba(219,109,40,.22); --tint-red:rgba(248,81,73,.20); --tint-purple:rgba(163,113,247,.22); --tint-blue:rgba(56,139,253,.20);
  --tintb-green:rgba(86,211,100,.5); --tintb-amber:rgba(227,179,65,.5); --tintb-orange:rgba(219,109,40,.55); --tintb-red:rgba(255,107,110,.5); --tintb-purple:rgba(163,113,247,.55); --tintb-blue:rgba(56,139,253,.55);
  --kpiv-text-mix:62%;
  --acc-blue:#4DA3E8; --acc-purple:#A98CD6; --acc-orange:#E8823D;
  color-scheme:dark;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','Segoe UI Web',Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
.mc{font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
.app{max-width:1320px;margin:0 auto;padding:16px 16px 32px;}
.hdr{display:flex;align-items:center;gap:14px;padding:14px 20px;background:var(--surface);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px;flex-wrap:wrap;border:1px solid var(--border);}
.hdr-title{font-size:18px;font-weight:700;color:var(--text-strong);letter-spacing:-.3px;}
.hdr-date{font-size:12px;color:var(--text-2);font-weight:400;}
.hdr-gen{font-size:10px;color:var(--text-faint);font-weight:400;margin-top:1px;}
.sep{width:1px;height:32px;background:var(--border);}
.hs{text-align:center;padding:0 10px;}
.hs .v{font-size:22px;font-weight:700;line-height:1.1;}
.hs .l{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;font-weight:600;}
.tier-hdr{font-size:10px;font-weight:700;letter-spacing:1.2px;padding:4px 10px;border-radius:6px;}

/* v9: Data-quality chip row */
.dq-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.dq-chip.ok{background:var(--tint-green);border-color:#107C1040;color:var(--sig-green);}
.tier-badge{display:inline-block;padding:1px 6px;background:#D1343818;color:#D13438;border:1px solid #D1343840;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:0.3px;margin-left:2px;vertical-align:middle;}
.dq-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);font-size:12px;color:var(--text-2);line-height:1.3;}
.dq-chip .dq-n{font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;}
.dq-chip .dq-l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);}
.dq-chip.warn{border-color:var(--tintb-amber);background:var(--tint-amber);}
.dq-chip.warn .dq-n{color:var(--sig-amber);}
.dq-chip.warn .dq-l{color:var(--sig-amber);}
.dq-chip.info{border-color:var(--tintb-blue);background:var(--tint-blue);}
.dq-chip.info .dq-n{color:var(--acc-blue);}
.dq-chip.info .dq-l{color:var(--acc-blue);}
.dq-chip.hold{border-color:var(--tintb-purple);background:var(--tint-purple);}
.dq-chip.hold .dq-n{color:var(--acc-purple);}
.dq-chip.hold .dq-l{color:var(--acc-purple);}

.tabs{display:flex;gap:4px;margin-bottom:16px;}
.tab{flex:1;padding:10px 12px;text-align:center;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;border-radius:8px;transition:all .15s;background:var(--surface);border:1px solid var(--border);user-select:none;}
.tab:hover{color:var(--text-strong);background:var(--surface-3);border-color:var(--border-strong);}
.tab.on{color:var(--acc-blue);background:var(--tint-blue);border-color:var(--acc-blue);box-shadow:0 1px 4px rgba(0,120,212,.12);}
.card{background:var(--surface);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border);overflow:hidden;}
table.t{width:100%;border-collapse:collapse;font-size:13px;}
table.t th{background:var(--surface-2);color:var(--text-2);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:2;}
table.t th.r{text-align:right;}table.t th.c{text-align:center;}
table.t td{padding:10px 12px;border-bottom:1px solid var(--surface-3);}
table.t td.r{text-align:right;}table.t td.c{text-align:center;}
table.t tr.s0{background:var(--surface);}table.t tr.s1{background:var(--surface-2);}
table.t tr:hover{background:var(--surface-3)!important;}
table.t tr.cu{opacity:.6;}table.t tr.cu td{font-style:italic;}
.dr{cursor:pointer;transition:background .12s;}
.dr td:first-child{padding-left:16px;}
.dn{font-weight:700;font-size:13px;color:var(--text-strong);}
.dl{font-size:11px;color:var(--text-muted);font-weight:500;}
.da{font-size:22px;font-weight:700;line-height:1;}
.db{width:100%;height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden;min-width:80px;}
.dbf{height:100%;border-radius:4px;transition:width .5s;}
.fc{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:12px;margin:1px 4px;white-space:nowrap;}
.tl{font-size:10px;font-weight:700;letter-spacing:1px;padding:4px 8px;border-radius:6px;}
.oc{font-size:10px;font-weight:700;letter-spacing:.6px;padding:4px 8px;border-radius:6px;}
.cc{font-size:9px;font-weight:700;letter-spacing:.8px;padding:2px 6px;border-radius:4px;background:var(--tint-purple);color:var(--acc-purple);border:1px solid var(--tintb-purple);vertical-align:middle;margin-left:6px;}
.gd{background:var(--surface-2);padding:16px 20px 16px 24px;animation:fi .15s ease;border-top:1px solid var(--surface-3);}
.gs{margin-bottom:12px;}.gs:last-child{margin-bottom:0;}
.gl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:4px;}
.gt{font-size:13px;color:var(--text-2);line-height:1.65;}
.ob{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;margin-top:8px;}
.ub{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--tint-blue);border:1px solid var(--tintb-blue);}
.ub-label{font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--acc-blue);margin-bottom:3px;text-transform:uppercase;}
.ub-text{font-size:12px;color:var(--acc-blue);line-height:1.55;opacity:.85;}
@keyframes fi{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.sl{padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);background:var(--surface-3);border-bottom:1px solid var(--border);border-top:1px solid var(--border);}
.gw{background:var(--surface);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border);padding:20px;margin-bottom:14px;}
.gt2{display:flex;align-items:center;gap:20px;margin-bottom:12px;flex-wrap:wrap;}
.gp{font-size:44px;font-weight:700;line-height:1;}
.gi-t{font-size:15px;font-weight:600;color:var(--text-strong);}
.gi-s{font-size:12px;color:var(--text-2);}
.gb{height:8px;background:var(--surface-3);border-radius:5px;position:relative;overflow:visible;}
.gbf{height:100%;border-radius:5px;transition:width .5s;}
.gm{position:absolute;top:-5px;height:18px;width:2px;border-radius:1px;}
.gbl{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--text-muted);}
.wb{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.55;}
.ru{background:var(--surface);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border);padding:16px 20px;margin-bottom:14px;}
.ru h3{font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:6px;}
.ru p{font-size:12px;color:var(--text-2);line-height:1.6;}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.fb{font-size:11px;padding:6px 12px;border-radius:16px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);cursor:pointer;font-family:'Segoe UI',sans-serif;font-weight:600;transition:all .12s;}
.fb:hover{color:var(--text-strong);border-color:var(--text-muted);background:var(--surface-3);}
.fb.on{background:var(--tint-blue);color:var(--acc-blue);border-color:var(--acc-blue);}
.sw{overflow-x:auto;max-height:480px;overflow-y:auto;}
.st{font-size:13px;font-weight:700;color:var(--text-strong);margin:16px 0 10px;}
.nt{font-size:10px;color:var(--text-muted);margin-top:6px;padding:0 4px;}
.biz-note{font-size:10px;color:var(--text-muted);padding:6px 12px;text-align:right;}
.tab-content{display:none;}.tab-content.active{display:block;}

/* v9: profile pill + margin bar */
.prof-pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border);letter-spacing:.2px;}
.prof-pill.unc{background:var(--tint-red);color:var(--sig-red);border-color:var(--tintb-red);}
.prof-pill.prov{background:var(--tint-purple);color:var(--acc-purple);border-color:var(--tintb-purple);}
.margin-bar{position:relative;height:8px;width:90px;background:var(--surface-3);border-radius:4px;overflow:hidden;}
.margin-bar .mbf{position:absolute;top:0;left:0;height:100%;border-radius:4px;transition:width .5s;}
.margin-cell{display:flex;align-items:center;gap:8px;}
.margin-num{font-variant-numeric:tabular-nums;font-size:11px;font-weight:700;min-width:36px;text-align:right;}

/* ─── SIGNAL LEGEND ─── */
.legend-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;user-select:none;transition:all .15s;}
.legend-toggle:hover{background:var(--surface-3);border-color:var(--border-strong);}
.legend-toggle .chevron{font-size:10px;color:var(--text-muted);transition:transform .2s;display:inline-block;}
.legend-toggle .chevron.open{transform:rotate(90deg);}
.legend-toggle .ltitle{font-size:11px;font-weight:700;color:var(--text-2);letter-spacing:.4px;text-transform:uppercase;}
.legend-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;margin-left:8px;}
.legend-chip{font-size:10px;font-weight:700;padding:2px 10px;border-radius:10px;letter-spacing:.3px;}
.legend-panel{overflow:hidden;max-height:0;transition:max-height .3s ease;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.legend-panel.open{max-height:1400px;}
.legend-inner{padding:20px;}
.legend-section{margin-bottom:20px;}.legend-section:last-child{margin-bottom:0;}
.legend-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--surface-3);}
.legend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.legend-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--surface-3);transition:background .12s;}
.legend-item:hover{background:var(--surface-3);}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.legend-bar{width:4px;height:100%;min-height:32px;border-radius:2px;flex-shrink:0;}
.legend-name{font-size:12px;font-weight:700;color:var(--text-strong);margin-bottom:2px;}
.legend-desc{font-size:11px;color:var(--text-2);line-height:1.5;}
.legend-profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
.legend-profile-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--surface-3);}
.legend-profile-name{font-size:12px;font-weight:600;color:var(--text-strong);}
.legend-profile-range{font-variant-numeric:tabular-nums;font-size:11px;font-weight:700;color:var(--acc-blue);}
.legend-profile-range.prov{color:var(--acc-purple);}

/* ─── PRODUCTION FLOW VIZ ─── */
.flow-wrap{padding:4px 0;}
.flow-pipeline{display:flex;align-items:stretch;gap:0;margin:16px 0;position:relative;overflow-x:auto;padding:8px 0;}
.flow-node{flex:1;min-width:130px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;}
.flow-box{width:100%;padding:14px 10px;border-radius:12px;text-align:center;border:2px solid;position:relative;background:var(--surface);transition:transform .15s,box-shadow .15s;}
.flow-box:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1);}
.flow-dept{font-size:11px;font-weight:700;color:var(--text-strong);margin-bottom:4px;line-height:1.2;}
.flow-lead{font-size:9px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.flow-ar{font-size:22px;font-weight:800;line-height:1;margin-bottom:2px;}
.flow-ratio{font-size:9px;color:var(--text-muted);margin-bottom:6px;}
.flow-flags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;}
.flow-flag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;}
.flow-incoming{font-size:9px;font-weight:700;color:var(--acc-blue);letter-spacing:.3px;margin-top:5px;padding:2px 8px;border-radius:8px;background:var(--tint-blue);border:1px solid var(--tintb-blue);}
.flow-profile-mix{margin-top:6px;display:flex;flex-direction:column;gap:2px;font-size:9px;line-height:1.3;}
.flow-profile-mix-row{display:flex;justify-content:space-between;align-items:center;gap:4px;color:var(--text-2);}
.flow-profile-mix-row .pfn{font-weight:600;}
.flow-profile-mix-row .pfc{font-variant-numeric:tabular-nums;color:var(--text-muted);}
.flow-arrow{display:flex;align-items:center;justify-content:center;min-width:36px;position:relative;z-index:0;}
.flow-arrow svg{display:block;}
.flow-arrow-thick{min-width:40px;}
.flow-arrow-thick svg{width:40px;height:30px;}
.flow-bottleneck-ring{position:absolute;inset:-4px;border-radius:14px;border:2px dashed;animation:pulse-ring 1.5s ease-in-out infinite;pointer-events:none;}
@keyframes pulse-ring{0%,100%{opacity:.4;}50%{opacity:1;}}

/* ─── v11: CLICKABLE KPIs + MODAL ─── */
.hs.clickable, .dq-chip.clickable { cursor: pointer; position: relative; transition: background .15s, box-shadow .15s, transform .12s; }
.hs.clickable{border-radius:8px; padding:6px 10px;}
.hs.clickable:hover { background: var(--surface-3); }
.hs.clickable:focus-visible { outline: 2px solid var(--acc-blue); outline-offset: 2px; }
.hs.clickable::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-right: 1.5px solid var(--text-muted); border-top: 1.5px solid var(--text-muted); transform: rotate(45deg); opacity: 0; transition: opacity .15s; }
.hs.clickable:hover::after { opacity: 1; }
.dq-chip.clickable:hover { box-shadow: 0 3px 10px rgba(0,0,0,.08); transform: translateY(-1px); }
.dq-chip.clickable:focus-visible { outline: 2px solid var(--acc-blue); outline-offset: 2px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(50,49,48,.55); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; backdrop-filter: blur(2px); }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 1100px; box-shadow: 0 12px 40px rgba(0,0,0,.25); border: 1px solid var(--border); overflow: hidden; animation: modalIn .18s ease; }
@keyframes modalIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.modal-hdr { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--surface-2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.modal-title { font-size:15px; font-weight: 700; color: var(--text-strong); flex-grow: 1; letter-spacing: -.2px; }
.modal-count { font-variant-numeric:tabular-nums; font-size:11px; color: var(--text-2); font-weight: 600; background: var(--surface-3); padding: 4px 10px; border-radius: 10px; }
.modal-close { background: transparent; border: none; font-size:18px; color: var(--text-muted); cursor: pointer; padding: 4px 12px; border-radius: 6px; font-weight: 700; font-family: inherit; }
.modal-close:hover { background: var(--surface-3); color: var(--text-strong); }
.modal-controls { display: flex; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap; background: var(--surface); }
.modal-ctrl-label { font-size:10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); }
.modal-ctrl-sel { padding: 6px 28px 6px 10px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23605E5C' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 10px center; font-size:12px; font-family: 'Segoe UI', sans-serif; color: var(--text); cursor: pointer; appearance: none; -webkit-appearance: none; min-width: 180px; }
.modal-ctrl-sel:hover { border-color: var(--text-muted); }
.modal-ctrl-sel:focus { outline: 2px solid var(--acc-blue); outline-offset: -1px; border-color: var(--acc-blue); }
.modal-body { max-height: 65vh; overflow-y: auto; }
.modal-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size:13px; }
.modal-foot { padding: 10px 20px; border-top: 1px solid var(--border); background: var(--surface-2); font-size:10px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.modal-body table.t { font-size:13px; }
.modal-body table.t th { position: sticky; top: 0; z-index: 3; }
.modal-body .status-pill { font-size:10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
.modal-body .status-short { background: var(--tint-red); color: var(--sig-red); border: 1px solid var(--tintb-red); }
.modal-body .status-upcoming { background: var(--tint-blue); color: var(--acc-blue); border: 1px solid var(--tintb-blue); }
.modal-body .status-complete { background: var(--tint-amber); color: var(--sig-amber); border: 1px solid var(--tintb-amber); }
.modal-body .status-aging { background: var(--tint-red); color: var(--sig-red); border: 1px solid var(--tintb-red); }
.modal-body .status-none { color: var(--text-muted); font-style: italic; font-size:11px; }
.flow-section-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);text-align:center;padding:4px 0 8px;width:100%;}
.flow-separator{display:flex;align-items:center;justify-content:center;min-width:2px;padding:0 4px;}
.flow-separator-line{width:1px;height:60%;background:var(--border);}
.flow-customer-badge{font-size:9px;font-weight:700;letter-spacing:.6px;padding:2px 6px;border-radius:4px;background:var(--tint-purple);color:var(--acc-purple);border:1px solid var(--tintb-purple);margin-top:4px;}
.flow-metric-strip{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;padding:14px 16px;background:var(--surface);border-radius:10px;border:1px solid var(--border);}
.flow-metric{text-align:center;flex:1;min-width:100px;}
.flow-metric-val{font-size:18px;font-weight:700;line-height:1.2;}
.flow-metric-lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin-top:2px;}
.flow-bottleneck-callout{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:10px;margin-top:10px;border:1px solid;}
.flow-callout-icon{font-size:22px;flex-shrink:0;}
.flow-callout-text{font-size:12px;line-height:1.55;flex:1;}
.flow-callout-title{font-weight:700;margin-bottom:2px;}
.flow-callout-mix{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
.flow-callout-mix .pchip{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);}
.flow-callout-mix .pchip.tight{background:var(--tint-red);color:var(--sig-red);border-color:var(--tintb-red);}
.flow-callout-mix .pchip.long{background:var(--tint-green);color:var(--sig-green);border-color:var(--tintb-green);}
.flow-callout-mix .pchip.unc{background:var(--tint-amber);color:var(--sig-amber);border-color:var(--tintb-amber);}

/* ═══ RESCHEDULE STATUS v12 (decision-first) ═══ */
.rs-ontime-hero{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:20px 24px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:12px;}
.rs-ontime-hero.ok{background:linear-gradient(135deg,var(--tint-green) 0%,var(--surface) 70%);border:1px solid var(--tintb-green);}
.rs-ontime-hero.warn{background:linear-gradient(135deg,var(--tint-amber) 0%,var(--surface) 70%);border:1px solid var(--tintb-amber);}
.rs-ontime-fig{display:flex;align-items:baseline;gap:10px;}
.rs-ontime-num{font-variant-numeric:tabular-nums;font-size:44px;font-weight:700;line-height:1;}
.rs-ontime-divider{font-variant-numeric:tabular-nums;font-size:22px;color:var(--text-muted);font-weight:700;line-height:1.2;}
.rs-ontime-denom{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;line-height:1.2;color:var(--text-2);}
.rs-ontime-meta{display:flex;flex-direction:column;gap:4px;}
.rs-ontime-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;}
.rs-ontime-pct{font-size:22px;font-weight:700;line-height:1.2;}
.rs-ontime-context{font-size:12px;color:var(--text-2);line-height:1.5;}
.rs-ontime-context strong{color:var(--text-strong);}
.rs-target-band{position:relative;height:32px;background:var(--surface-3);border-radius:8px;overflow:hidden;border:1px solid var(--border);min-width:200px;}
.rs-target-band-zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(16,124,16,.18) 0%,rgba(16,124,16,.32) 100%);border-left:2px dashed #107C10;}
.rs-target-band-marker{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;}
.rs-target-band-labels{display:flex;justify-content:space-between;margin-top:5px;font-size:9px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.rs-target-zone-label{position:absolute;top:50%;transform:translate(-50%,-50%);left:88%;font-size:9px;font-weight:700;color:var(--sig-green);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;}

.rs-buffer-strip{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;font-size:12px;color:var(--text-2);}
.rs-buffer-strip .buf-pct{font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;}
.rs-buffer-strip .buf-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-2);margin-bottom:2px;}
.rs-buffer-strip .buf-detail{font-size:11px;color:var(--text-2);}
.rs-buffer-strip .gb{flex:1;height:6px;background:var(--surface-3);border-radius:5px;position:relative;overflow:visible;min-width:140px;}
.rs-buffer-strip .gbf{height:100%;border-radius:5px;}
.rs-buffer-strip .gm{position:absolute;top:-5px;height:16px;width:2px;border-radius:1px;}

.rs-exceptions{background:var(--surface);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid var(--border);padding:16px 20px;margin-bottom:18px;}
.rs-exceptions-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-2);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.rs-exceptions-title .right{font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:.5px;text-transform:none;}
.rs-tile-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.rs-tile{padding:12px 14px;border-radius:10px;border:1px solid;background:var(--surface);text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;display:block;position:relative;overflow:hidden;}
.rs-tile:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1);}
.rs-tile .tc-num{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;line-height:1;}
.rs-tile .tc-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:3px;}
.rs-tile .tc-sub{font-size:10px;color:var(--text-muted);margin-top:3px;line-height:1.3;}
.rs-tile.b1{border-color:var(--tintb-red);background:var(--tint-red);}
.rs-tile.b1 .tc-num,.rs-tile.b1 .tc-lbl{color:#D13438;}
.rs-tile.b2{border-color:var(--tintb-amber);background:var(--tint-amber);}
.rs-tile.b2 .tc-num,.rs-tile.b2 .tc-lbl{color:#C19C00;}
.rs-tile.b3{border-color:var(--tintb-orange);background:var(--tint-orange);}
.rs-tile.b3 .tc-num,.rs-tile.b3 .tc-lbl{color:var(--acc-orange);}
.rs-tile.b4{border-color:var(--border);background:var(--surface-2);}
.rs-tile.b4 .tc-num,.rs-tile.b4 .tc-lbl{color:var(--text-2);}
.rs-tile.b5{border-color:var(--tintb-purple);background:var(--tint-purple);}
.rs-tile.b5 .tc-num,.rs-tile.b5 .tc-lbl{color:var(--acc-purple);}

.rs-section{margin-top:24px;}
.rs-section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;border-left:4px solid;}
.rs-section-hdr.s1{border-left-color:#D13438;}
.rs-section-hdr.s2{border-left-color:#C19C00;}
.rs-section-hdr.s3{border-left-color:var(--acc-orange);}
.rs-section-hdr.s4{border-left-color:var(--text-muted);}
.rs-section-hdr.s5{border-left-color:var(--acc-purple);}
.rs-section-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.rs-section-dot.s1{background:#D13438;}
.rs-section-dot.s2{background:#C19C00;}
.rs-section-dot.s3{background:var(--acc-orange);}
.rs-section-dot.s4{background:var(--text-muted);}
.rs-section-dot.s5{background:var(--acc-purple);}
.rs-section-title{font-size:15px;font-weight:700;color:var(--text-strong);letter-spacing:-.2px;}
.rs-section-count{font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-2);background:var(--surface-3);padding:2px 10px;border-radius:10px;font-weight:700;}
.rs-section-sub{font-size:11px;color:var(--text-muted);margin-left:auto;font-style:italic;}

.rs-empty{padding:14px 18px;background:var(--tint-green);border:1px solid var(--tintb-green);border-radius:10px;color:var(--sig-green);font-size:12px;line-height:1.6;}

.rs-urgent-card{background:var(--surface);border-radius:12px;border:2px solid var(--tintb-red);box-shadow:0 4px 16px rgba(209,52,56,.1);overflow:hidden;margin-bottom:10px;}
.rs-urgent-hdr{display:flex;align-items:center;gap:14px;padding:14px 18px;background:linear-gradient(90deg,var(--tint-red) 0%,var(--surface) 60%);border-bottom:1px solid var(--tintb-red);flex-wrap:wrap;}
.rs-urgent-deadline{font-size:11px;font-weight:700;letter-spacing:1px;color:#fff;background:#D13438;padding:6px 12px;border-radius:6px;animation:rs-pulse 2s ease-in-out infinite;}
@keyframes rs-pulse{0%,100%{box-shadow:0 0 0 0 rgba(209,52,56,.45);}70%{box-shadow:0 0 0 10px rgba(209,52,56,0);}}
.rs-urgent-wo{font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;color:var(--text-strong);}
.rs-urgent-customer{font-size:13px;color:var(--text);font-weight:600;}
.rs-urgent-body{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.rs-urgent-option{padding:18px 22px;border-right:1px solid var(--border);}
.rs-urgent-option:last-child{border-right:none;}
.rs-urgent-option.recommended{background:var(--tint-green);}
.rs-urgent-option-tag{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:6px;margin-bottom:10px;}
.rs-urgent-option-tag.rec{background:#107C10;color:#fff;}
.rs-urgent-option-tag.alt{background:var(--surface-3);color:var(--text-2);}
.rs-urgent-option h4{font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:8px;}
.rs-urgent-option .big{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;color:var(--text-strong);margin-bottom:4px;}
.rs-urgent-option .big.bad{color:#D13438;}
.rs-urgent-option .small{font-size:11px;color:var(--text-2);line-height:1.5;}
.rs-urgent-option .small strong{color:var(--text-strong);}
.rs-urgent-foot{padding:10px 18px;background:var(--surface-2);border-top:1px solid var(--surface-3);font-size:11px;color:var(--text-2);display:flex;justify-content:space-between;align-items:center;}
.rs-show-math{cursor:pointer;color:var(--acc-blue);font-weight:600;text-decoration:none;}
.rs-show-math:hover{text-decoration:underline;}

.rs-action-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;letter-spacing:.2px;white-space:nowrap;}
.rs-action-pill.burn{background:var(--tint-amber);color:var(--sig-amber);border:1px solid var(--tintb-amber);}
.rs-action-pill.notify{background:var(--tint-red);color:var(--sig-red);border:1px solid var(--tintb-red);}
.rs-action-pill.escalate{background:var(--tint-purple);color:var(--acc-purple);border:1px solid var(--tintb-purple);}

.rs-mini-wo{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text-strong);font-size:13px;}
.rs-mini-cust{font-size:11px;color:var(--text-2);margin-top:1px;}
.rs-deadline-cell .day{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--text-strong);}
.rs-deadline-cell .bd{font-size:10px;color:var(--text-muted);font-weight:600;}
.rs-deadline-cell .bd.tight{color:var(--sig-red);}
.rs-target-cell .date{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--text-strong);}
.rs-target-cell .band{font-size:10px;color:var(--text-muted);font-weight:600;}
.rs-conf-pill{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:2px 8px;border-radius:8px;letter-spacing:.3px;text-transform:uppercase;width:fit-content;margin-top:3px;}
.rs-conf-pill .dot{width:5px;height:5px;border-radius:50%;}
.rs-conf-pill.confident{background:var(--tint-green);color:var(--sig-green);}
.rs-conf-pill.confident .dot{background:#107C10;}
.rs-conf-pill.caution{background:var(--tint-amber);color:var(--sig-amber);}
.rs-conf-pill.caution .dot{background:#C19C00;}

.rs-tradeoff{font-size:12px;color:var(--text-2);line-height:1.5;max-width:340px;}
.rs-tradeoff strong{color:var(--sig-red);}

.rs-row-toggle{font-size:13px;color:var(--text-muted);width:18px;text-align:center;font-weight:700;display:inline-block;}
tr.rs-expandable.open .rs-row-toggle{color:var(--acc-blue);}

.rs-risk-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.rs-risk-chip{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--tint-amber);color:var(--sig-amber);border:1px solid var(--tintb-amber);letter-spacing:.2px;}
.rs-risk-chip.severe{background:var(--tint-red);color:var(--sig-red);border-color:var(--tintb-red);}


.rs-detail-row{background:var(--surface-2)!important;}
.rs-detail-row td{padding:0!important;}
.rs-detail-inner{padding:18px 24px;}
.rs-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.rs-detail-section h4{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:4px;}
.rs-calc-line{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--text-2);line-height:1.5;}
.rs-calc-line .val{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text-strong);}
.rs-calc-line.adjust{color:var(--sig-amber);}
.rs-calc-line.adjust .val{color:var(--sig-amber);}
.rs-calc-line.maxapp{color:var(--sig-green);font-weight:700;border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
.rs-calc-line.maxapp .val{color:var(--sig-green);}
.rs-calc-line.inactive{color:var(--text-faint);}
.rs-calc-line.inactive .label{text-decoration:line-through;}
.rs-calc-line.inactive .val{color:var(--text-faint);}

.rs-collapse-toggle{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;cursor:pointer;user-select:none;}
.rs-collapse-toggle:hover{background:var(--surface-3);}
.rs-collapse-toggle .chev{font-size:11px;color:var(--text-muted);display:inline-block;transition:transform .2s;}
.rs-collapse-toggle.open .chev{transform:rotate(90deg);}
.rs-collapse-toggle .ct-text{font-size:12px;font-weight:600;color:var(--text-2);}

.rs-esc-list{display:flex;flex-direction:column;gap:6px;}
.rs-esc-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;border-left:3px solid var(--acc-purple);}
.rs-esc-badge{display:flex;align-items:center;justify-content:center;min-width:36px;height:28px;padding:0 6px;border-radius:14px;background:var(--tint-purple);color:var(--acc-purple);font-size:10px;font-weight:700;letter-spacing:.5px;flex-shrink:0;border:1px solid var(--tintb-purple);}
.rs-esc-body{flex:1;}
.rs-esc-line1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px;}
.rs-esc-reason{font-size:12px;color:var(--text-2);line-height:1.55;}
.rs-esc-action{font-size:12px;color:var(--acc-purple);font-weight:700;line-height:1.55;margin-top:3px;}

.rs-explainer{margin-top:24px;border-top:1px solid var(--border);padding-top:14px;}
.rs-explainer-toggle{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;cursor:pointer;user-select:none;}
.rs-explainer-toggle:hover{background:var(--surface-3);}
.rs-explainer-toggle .chev{font-size:11px;color:var(--text-muted);display:inline-block;transition:transform .2s;}
.rs-explainer-toggle.open .chev{transform:rotate(90deg);}
.rs-explainer-content{display:none;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:18px 22px;}
.rs-explainer-content.open{display:block;}
.rs-explainer-content h3{font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:6px;margin-top:14px;}
.rs-explainer-content h3:first-child{margin-top:0;}
.rs-explainer-content p, .rs-explainer-content li{font-size:12px;color:var(--text-2);line-height:1.65;}
.rs-explainer-content ol{margin:8px 0 0 20px;}
.rs-explainer-content ol li{margin-bottom:4px;}
.rs-explainer-content strong{color:var(--text-strong);}
  
/* ===== KPI signal bubbles (added) ===== */
.kpiv{display:inline-block;padding:2px 14px;border-radius:999px;line-height:1.25;
  background:var(--surface);
  background:color-mix(in srgb, var(--kpi) 12%, var(--surface));
  color:var(--kpi);
  border:1px solid var(--kpi);
  border:1px solid color-mix(in srgb, var(--kpi) 32%, transparent);}
.hs .v.kpiv{font-size:18px;}
[data-theme="dark"] .kpiv{
  background:color-mix(in srgb, var(--kpi) 26%, var(--surface));
  color:color-mix(in srgb, var(--kpi) 38%, #ffffff);
  border-color:color-mix(in srgb, var(--kpi) 50%, transparent);}
.tier-hdr.kpiv{font-size:10px;font-weight:700;letter-spacing:1.2px;padding:4px 12px;}

/* ===== Theme toggle (added) ===== */
.theme-toggle{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text-2);font-family:'Segoe UI',Arial,sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.4px;text-transform:uppercase;cursor:pointer;transition:background .15s,border-color .15s,color .15s;}
.theme-toggle:hover{border-color:var(--border-strong);color:var(--text-strong);background:var(--surface-3);}
.theme-toggle svg{width:15px;height:15px;display:block;flex-shrink:0;}
.theme-toggle .tt-sun{display:none;}
.theme-toggle .tt-moon{display:block;}
[data-theme="dark"] .theme-toggle .tt-sun{display:block;}
[data-theme="dark"] .theme-toggle .tt-moon{display:none;}
.theme-toggle .tt-label::after{content:"Dark";}
[data-theme="dark"] .theme-toggle .tt-label::after{content:"Light";}

/* ===== PROJECTOR + BRAND ===== */
.app{max-width:1600px;}
body{background:var(--bg);}
.hdr{gap:18px;padding:16px 24px;align-items:center;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-logo{width:52px;height:52px;flex-shrink:0;display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.28));}
.brand-text{display:flex;flex-direction:column;gap:2px;}
.hdr-title{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.04;}
.hdr-date{font-size:13px;color:var(--text-2);font-weight:500;}
.sep{height:46px;}

/* Header KPI sizing for at-a-glance reading on a projector */
.hs .l{font-size:11px;letter-spacing:.6px;color:var(--text-muted);}
.hs .v.kpiv{font-size:28px;padding:4px 16px;font-weight:800;}
.hs[data-kpi="ar"] .v.kpiv{font-size:34px;padding:6px 20px;}
.hs[data-kpi="tier"] .tier-hdr.kpiv{font-size:13px;padding:8px 16px;}
.hs[data-kpi="critical"] .v.kpiv,.hs[data-kpi="pastdue"] .v.kpiv{font-size:28px;}

/* Tabs: larger, clearer active state */
.tabs{gap:6px;margin-bottom:18px;}
.tab{font-size:15px;font-weight:700;padding:14px 14px;}

/* Department table: tall rows, big names + AR */
table.t{font-size:15px;}
table.t th{font-size:11px;padding:12px 14px;letter-spacing:.7px;}
table.t td{padding:14px 14px;}
.dn{font-size:18px;}
.dl{font-size:12px;}
.da{font-size:28px;font-weight:800;}
.sl{font-size:11px;letter-spacing:1.3px;padding:12px 14px;}

/* No harsh zebra; clean alternating surfaces */
table.t tr.s0{background:var(--surface);}
table.t tr.s1{background:var(--surface-2);}
table.t tr:hover{background:var(--surface-3)!important;}

/* Brighten signal numbers in dark so they carry across the floor */
[data-theme="dark"] .da,
[data-theme="dark"] .flow-ar,
[data-theme="dark"] .rs-ontime-pct,
[data-theme="dark"] .rs-ontime-num{filter:brightness(1.5) saturate(1.06);}

@media (max-width:900px){
  .hdr-title{font-size:22px;}
  .brand-logo{width:44px;height:44px;}
  .hs .v.kpiv{font-size:22px;}
  .hs[data-kpi="ar"] .v.kpiv{font-size:28px;}
}

  
/* ===== HERO BAND ===== */
.hdr{flex-direction:column;align-items:stretch;gap:14px;}
.hdr-top{display:flex;align-items:center;gap:16px;}
.hdr-top .theme-toggle{margin-left:auto;}
.pulse-hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
.hero-main,.hero-exc{display:flex;align-items:center;gap:24px;}
.hero-sep{width:1px;align-self:stretch;min-height:56px;background:var(--border);}
.hero-pulse{display:flex;flex-direction:column;gap:2px;}
.hero-pulse svg{cursor:crosshair;touch-action:pan-y;}
.hero-pulse-cap{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--text-muted);text-transform:uppercase;min-height:14px;transition:color .12s;}
.hero-pulse-cap.live{color:var(--text-strong);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums;}
.hp-tick{font-size:9.5px;fill:var(--text-muted);font-variant-numeric:tabular-nums;}
.hp-band{font-size:9.5px;font-weight:700;letter-spacing:.06em;fill:var(--text-2);}
.hp-lim{font-size:8.5px;font-weight:600;fill:var(--sig-green);}
.hp-pair{display:flex;gap:16px;align-items:flex-end;}
.hp-chart{width:236px;max-width:100%;height:auto;}
@media (max-width:900px){.hp-pair{flex-wrap:wrap;}.hp-chart{flex:1 1 220px;}}
#fresh-chip{position:fixed;left:50%;bottom:18px;transform:translate(-50%,80px);background:var(--acc-blue);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:22px;box-shadow:0 4px 16px rgba(0,0,0,.22);cursor:pointer;z-index:70;opacity:0;transition:transform .25s ease,opacity .25s ease;user-select:none;}
#fresh-chip.show{transform:translate(-50%,0);opacity:1;}
#fresh-chip:active{transform:translate(-50%,0) scale(.97);}
@media (max-width:700px){.hero-pulse{flex:1 1 100%;order:9;}.hero-pulse svg{width:100%;height:40px;}}
.pulse-hero .hs{padding:2px 4px;}
.pulse-hero .l{font-size:12px;font-weight:700;}
.hero-main .hs[data-kpi="ar"] .v.kpiv{font-size:44px;padding:6px 24px;}
.hero-exc .hs[data-kpi="critical"] .v.kpiv,.hero-exc .hs[data-kpi="pastdue"] .v.kpiv{font-size:34px;}
.pulse-context{display:flex;align-items:center;gap:22px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:13px;}
.pulse-context .hs .v.kpiv{font-size:22px;}
.pulse-context .l{font-size:10px;}
@media (max-width:760px){
  .hero-main .hs[data-kpi="ar"] .v.kpiv{font-size:34px;}
  .hero-sep{display:none;}
}

  
/* ─── v13 design-system pass: states, motion, mobile ─── */
.clickable:focus-visible,.tab:focus-visible,.dq-chip:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc-blue);outline-offset:2px;border-radius:8px;}
.clickable:active,.tab:active,.fb:active{transform:scale(.98);}
.tab-content.active{animation:tabIn .18s ease-out;}
@keyframes tabIn{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
.modal.open .modal-box,#kpi-modal.open>div{animation:modalIn .16s ease-out;}
@keyframes modalIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}
@media (max-width:700px){
  .tabs{flex-wrap:wrap;}.tab{flex:1 1 45%;}
  /* tables scroll inside their card instead of clipping */
  .card{overflow-x:auto;}
  .card table.t{min-width:560px;}
  table.t th,table.t td{padding:8px 8px;}
  .pulse-hero .hero-ar{font-size:34px;}
  /* Trends dept rows stack: name/chip/arrow, full-width spark, sentence below */
  .tr-dept-row{grid-template-columns:1fr 56px 22px;grid-template-areas:"name chip glyph" "spark spark spark" "sent sent sent";row-gap:6px;}
  .tr-dept-name{grid-area:name;}
  .tr-dept-chip{grid-area:chip;}
  .tr-dept-glyph{grid-area:glyph;}
  .tr-dept-spark{grid-area:spark;}
  .tr-dept-spark svg{width:100%;height:30px;}
  .tr-dept-sent{grid-area:sent;}
  .tr-resp-row{grid-template-columns:104px 1fr 48px;}
}
.pulse-hero .hero-ar{font-size:44px;letter-spacing:-0.02em;}
.pulse-hero .hero-main .l,.pulse-context .l{letter-spacing:.04em;}

<script>
(function(){
  try{
    var saved = localStorage.getItem('qpc-theme');
    var sys = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    var theme = (saved === 'dark' || saved === 'light') ? saved : sys;
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('qpc-theme', next); }catch(e){}
}
</script>

// Profile buckets for mix-chip coloring

// ─── HELPERS ───
function getTier(ar) {
  if (ar <= 12) return { tier: "GREEN", color: "#107C10", ink: "#107C10" };
  if (ar <= 20) return { tier: "YELLOW", color: "#C19C00", ink: "#C19C00" };
  if (ar <= 35) return { tier: "RED", color: "#D13438", ink: "#D13438" };
  return { tier: "BLACK", color: "#323130", ink: "var(--sig-black)" };
}
function esc(s) { return s == null ? "\u2014" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function msBDColor(v) { return v != null && v < 0 ? "#D13438" : v != null && v <= 0 ? "var(--acc-orange)" : "#8A8886"; }
function dueBDColor(v) { return v != null && v < 0 ? "#D13438" : v != null && v <= 2 ? "var(--acc-orange)" : "#8A8886"; }
function prioStyle(p) {
  if (p === "Tier 1 Expedite" || p === "Hot Expedite") return "color:#D13438;font-weight:700";
  if (p === "Tier 2 Expedite") return "color:var(--acc-orange);font-weight:700";
  if (p === "Tier 3 Expedite" || p === "Expedite") return "color:#C19C00;font-weight:600";
  return "color:var(--text-muted)";
}

// Profile margin cell. Renders profile bar + (when tier present) tier bar side-by-side.
function profileMarginCell(j) {
  const hasTier = j.expediteTier != null;
  // Helper: one bar+label for a given burn pct + over-days
  function renderBar(pct, over, labelPrefix) {
    if (pct == null) return "";
    const width = Math.max(4, Math.min(100, pct));
    let color = "#107C10";
    if (pct >= 100) color = "#D13438";
    else if (pct >= 80) color = "var(--acc-orange)";
    else if (pct >= 60) color = "#C19C00";
    const overTxt = (over != null && over > 0)
      ? `<span style="color:#D13438;font-weight:700;font-size:10px">+${over}d</span>`
      : "";
    const prefix = labelPrefix
      ? `<span style="color:var(--text-muted);font-size:9px;font-weight:600;margin-right:2px">${labelPrefix}</span>`
      : "";
    return `<div class="margin-cell" style="margin-bottom:${labelPrefix?'2px':'0'}">
      ${prefix}
      <div class="margin-bar"><div class="mbf" style="width:${width}%;background:${color}"></div></div>
      <span class="margin-num" style="color:${color}">${pct}%</span>
      ${overTxt}
    </div>`;
  }
  if (j.isUnclassified && !hasTier) {
    return `<span class="prof-pill unc" title="Unclassified — assign profile to unlock urgency scoring">Unclassified</span>`;
  }
  if (j.isProvisional && !hasTier) {
    return `<span class="prof-pill prov" title="Source/DCMA — provisional target">Provisional</span>`;
  }
  // Tier present — render tier bar first (primary commitment), profile second (reference).
  if (hasTier) {
    const tierShort = j.expediteTier.replace('Tier ', 'T').replace(' Expedite', '');
    let out = renderBar(j.tierBurnPct, j.tierOverBD, tierShort);
    if (j.profileBurnPct != null) {
      out += renderBar(j.profileBurnPct, j.profileOverBD, 'PRF');
    }
    return out || `<span style="color:var(--text-muted);font-size:10px">—</span>`;
  }
  // Standard case: just profile.
  if (j.profileBurnPct == null) {
    return `<span style="color:var(--text-muted);font-size:10px">—</span>`;
  }
  return renderBar(j.profileBurnPct, j.profileOverBD, null);
}

function profilePill(j) {
  const tierBadge = (j.expediteTier != null)
    ? ` <span class="tier-badge" title="Tier commitment overrides profile lead time (${j.tierMin}\u2013${j.tierMax} biz days)">${j.expediteTier.replace('Tier ', 'T').replace(' Expedite', '')}</span>`
    : "";
  if (!j.profile) {
    return `<span class="prof-pill unc" title="Unclassified">—</span>${tierBadge}`;
  }
  const cls = j.isProvisional ? "prov" : "";
  const rng = j.profileMin != null ? ` (${j.profileMin}\u2013${j.profileMax}d)` : "";
  return `<span class="prof-pill ${cls}" title="${esc(j.profile)}${rng}">${esc(j.profile)}</span>${tierBadge}`;
}

// ─── HEADER ───
// Every .hs tile is clickable — opens the KPI drill-down modal for that metric.
// data-kpi attr maps to a KPI_CONFIGS entry defined below.
// Hero pulse: stock-ticker-style AR chart over every pipeline capture moment.
// Time-scaled x, crosshair scrub (mouse + touch) with a live readout, like a
// stock chart. Uses TRENDS.arPulse; degrades to nothing when trends absent.
const HP = { CW: 236, CH: 96, pts: [], x: null, yAg: null, yIn: null };
function buildHeroPulse() {
  const raw = (typeof TRENDS !== 'undefined' && TRENDS && TRENDS.arPulse) ? TRENDS.arPulse : null;
  if (!raw || raw.length < 5) return '';
  const pts = raw.map(p => ({ ...p, ms: new Date(p.t).getTime() }));
  const { tier, ink } = getTier(DATA.overall.ar);
  const W = HP.CW, H = HP.CH, mL = 26, mR = 8, mT = 16, mB = 13;
  const t0 = pts[0].ms, t1 = pts[pts.length - 1].ms;
  const x = p => mL + ((p.ms - t0) / Math.max(1, t1 - t0)) * (W - mL - mR);
  HP.pts = pts; HP.x = x;
  const last = pts[pts.length - 1];
  const days = Math.round((t1 - t0) / 86400000);

  const frame = (yMax) => {
    const y = v => (H - mB) - (v / yMax) * (H - mB - mT);
    let g = '';
    [[0, y(0)], [yMax, y(yMax)]].forEach(([v, yy]) => {
      g += `<line x1="${mL}" y1="${yy}" x2="${W - mR}" y2="${yy}" stroke="var(--border)" stroke-width="1" opacity="0.7"/>`
         + `<text x="${mL - 4}" y="${yy + 3}" text-anchor="end" class="hp-tick">${v}</text>`;
    });
    for (let i = 0; i < 3; i++) {
      const dt = new Date(t0 + (i / 2) * (t1 - t0));
      const anchor = i === 0 ? 'start' : i === 2 ? 'end' : 'middle';
      g += `<text x="${(mL + (i / 2) * (W - mL - mR)).toFixed(0)}" y="${H - 2}" text-anchor="${anchor}" class="hp-tick">${dt.getMonth() + 1}/${dt.getDate()}</text>`;
    }
    return { y, grid: g };
  };
  const linePath = (y, get) => pts.map((p, i) => `${i ? 'L' : 'M'}${x(p).toFixed(1)} ${y(get(p)).toFixed(1)}`).join('');

  // AGING pulse (the signal) - own scale, with the 12%-of-house limit curve
  const agMax = Math.ceil(Math.max(5, ...pts.map(p => Math.max(p.aging, p.inHouse * 0.12))) * 1.15 / 5) * 5;
  const fA = frame(agMax);
  HP.yAg = fA.y;
  const dAg = linePath(fA.y, p => p.aging);
  const dLim = linePath(fA.y, p => p.inHouse * 0.12);
  const svgA = `<svg id="hp-svg-a" class="hp-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aging jobs over ${days} days, with the 12 percent limit line">
    ${fA.grid}
    <text x="${mL}" y="9" class="hp-band"><tspan fill="var(--acc-orange)">●</tspan> AGING</text>
    <path d="${dLim}" fill="none" stroke="var(--sig-green)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
    <text x="${W - mR}" y="${(fA.y(last.inHouse * 0.12) - 4).toFixed(0)}" text-anchor="end" class="hp-lim">12% limit</text>
    <path d="${dAg}" fill="none" stroke="var(--acc-orange)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="hp-cross-a" y1="${mT}" y2="${H - mB}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 2" style="display:none"/>
    <circle id="hp-dot-a" r="3" fill="var(--acc-orange)" stroke="var(--surface)" stroke-width="1.5" style="display:none"/>
    <circle cx="${x(last).toFixed(1)}" cy="${fA.y(last.aging).toFixed(1)}" r="3.5" fill="${ink}" stroke="var(--surface)" stroke-width="1.5"/>
  </svg>`;

  // IN HOUSE pulse (flow context) - own scale
  const inMax = Math.max(20, Math.ceil(Math.max(...pts.map(p => p.inHouse)) * 1.1 / 20) * 20);
  const fB = frame(inMax);
  HP.yIn = fB.y;
  const dIn = linePath(fB.y, p => p.inHouse);
  const svgB = `<svg id="hp-svg-b" class="hp-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Jobs in house over ${days} days">
    <defs><linearGradient id="hp-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--acc-blue)" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="var(--acc-blue)" stop-opacity="0"/>
    </linearGradient></defs>
    ${fB.grid}
    <text x="${mL}" y="9" class="hp-band"><tspan fill="var(--acc-blue)">●</tspan> IN HOUSE</text>
    <path d="${dIn} L${x(last).toFixed(1)} ${fB.y(0)} L${mL} ${fB.y(0)} Z" fill="url(#hp-grad)"/>
    <path d="${dIn}" fill="none" stroke="var(--acc-blue)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <line id="hp-cross-b" y1="${mT}" y2="${H - mB}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="2 2" style="display:none"/>
    <circle id="hp-dot-b" r="3" fill="var(--acc-blue)" stroke="var(--surface)" stroke-width="1.5" style="display:none"/>
    <circle cx="${x(last).toFixed(1)}" cy="${fB.y(last.inHouse).toFixed(1)}" r="3" fill="var(--acc-blue)" stroke="var(--surface)" stroke-width="1.5"/>
  </svg>`;

  const typIn = pts.map(p => p.inHouse).sort((a, b) => a - b)[Math.floor(pts.length / 2)];
  const underLimit = last.aging <= last.inHouse * 0.12;
  const verdict = `${last.aging} aging — ${tier}${underLimit ? ', under the limit' : ', OVER the limit'} · ${last.inHouse} in house (typical ~${typIn})`;
  HP.defaultCapHTML = `<span style="color:${ink};font-weight:700">${esc(verdict)}</span>`;
  return `<div class="hero-sep"></div>
    <div class="hero-pulse">
      <div class="hero-pulse-cap" id="hp-readout">${HP.defaultCapHTML}</div>
      <div class="hp-pair">${svgA}${svgB}</div>
    </div>`;
}

function initHeroPulse() {
  const a = document.getElementById('hp-svg-a'), b = document.getElementById('hp-svg-b');
  if (!a || !b || !HP.pts.length) return;
  const readout = document.getElementById('hp-readout');
  const parts = {
    crossA: document.getElementById('hp-cross-a'), dotA: document.getElementById('hp-dot-a'),
    crossB: document.getElementById('hp-cross-b'), dotB: document.getElementById('hp-dot-b'),
  };
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const fmt = p => {
    const dt = new Date(p.ms);
    let h = dt.getHours() % 12 || 12;
    const ap = dt.getHours() < 12 ? 'AM' : 'PM';
    const when = p.daily ? `${DOW[dt.getDay()]} ${dt.getMonth() + 1}/${dt.getDate()} (EOD)`
                         : `${DOW[dt.getDay()]} ${dt.getMonth() + 1}/${dt.getDate()} ${h}:${String(dt.getMinutes()).padStart(2, '0')} ${ap}`;
    return `${when} — ${p.aging} aging / ${p.inHouse} in house (${p.ar}%)`;
  };
  // scrubbing either chart moves the crosshair in BOTH (same timeline)
  const scrub = (svg, clientX) => {
    const r = svg.getBoundingClientRect();
    const vx = (clientX - r.left) / r.width * HP.CW;
    let best = HP.pts[0], bd = Infinity;
    for (const p of HP.pts) { const dd = Math.abs(HP.x(p) - vx); if (dd < bd) { bd = dd; best = p; } }
    const px = HP.x(best);
    parts.crossA.setAttribute('x1', px); parts.crossA.setAttribute('x2', px); parts.crossA.style.display = '';
    parts.dotA.setAttribute('cx', px); parts.dotA.setAttribute('cy', HP.yAg(best.aging)); parts.dotA.style.display = '';
    parts.crossB.setAttribute('x1', px); parts.crossB.setAttribute('x2', px); parts.crossB.style.display = '';
    parts.dotB.setAttribute('cx', px); parts.dotB.setAttribute('cy', HP.yIn(best.inHouse)); parts.dotB.style.display = '';
    readout.textContent = fmt(best);
    readout.classList.add('live');
  };
  const reset = () => {
    ['crossA', 'dotA', 'crossB', 'dotB'].forEach(k => parts[k].style.display = 'none');
    readout.innerHTML = HP.defaultCapHTML; readout.classList.remove('live');
  };
  [a, b].forEach(svg => {
    svg.addEventListener('mousemove', e => scrub(svg, e.clientX));
    svg.addEventListener('mouseleave', reset);
    svg.addEventListener('touchstart', e => scrub(svg, e.touches[0].clientX), { passive: true });
    svg.addEventListener('touchmove', e => scrub(svg, e.touches[0].clientX), { passive: true });
    svg.addEventListener('touchend', () => setTimeout(reset, 1600), { passive: true });
  });
}

function buildDqRow() {
  const unclassAging = DATA.overall.unclassifiedAgingCount || 0;

  const shortSched = DATA.overall.shortScheduledCount || 0;
  const custHold = DATA.overall.customerHoldProfileCount || 0;

  const tierCount = DATA.overall.expediteTierCount || 0;

      ')</span>'
    : '';

function buildLegend() {
  const tierDefs = [
    { tier:"GREEN", color:"#107C10", ink:"#107C10", range:"≤ 12%", meaning:"Protecting OTD. Maintain pace." },
    { tier:"YELLOW", color:"#C19C00", ink:"#C19C00", range:"13–20%", meaning:"OTD at risk. Determine spike vs. trend." },
    { tier:"RED", color:"#D13438", ink:"#D13438", range:"21–35%", meaning:"OTD failing. Clear exits, then address constraint." },
    { tier:"BLACK", color:"#323130", ink:"var(--sig-black)", range:"> 35%", meaning:"System failure. Full reset needed." }
  ];
  const flagDefs = [
    { flag:"On Track", color:"#107C10", desc:"3+ biz days to milestone. Normal flow." },
    { flag:"Tight", color:"#C19C00", desc:"1–2 biz days to milestone. Front of queue — no room for delays." },
    { flag:"Reschedule Window", color:"var(--acc-orange)", desc:"1 biz day to milestone. Decision point: reschedule now or commit." },
    { flag:"Critical", color:"#D13438", desc:"≤ 0 biz days (milestone today or passed). Jumps every line." },
    { flag:"Past Due", color:"var(--acc-purple)", desc:"QPC Due Date has passed. This is an OTD miss." },
    { flag:"No Date", color:"#8A8886", desc:"Missing due date. Cannot enter signal system." }
  ];
  const tierChips = tierDefs.map(t =>
    `<span class="legend-chip kpiv" style="--kpi:${t.ink}">${t.tier}</span>`
  ).join("");
  const tierItems = tierDefs.map(t =>
    `<div class="legend-item"><div class="legend-dot" style="background:${t.ink}"></div><div><div class="legend-name" style="color:${t.ink}">${t.tier} <span style="font-weight:400;color:var(--text-muted);font-size:10px">${t.range}</span></div><div class="legend-desc">${t.meaning}</div></div></div>`
  ).join("");
  const flagItems = flagDefs.map(f =>
    `<div class="legend-item"><div style="width:4px;min-height:32px;border-radius:2px;flex-shrink:0;background:${f.color}"></div><div><div class="legend-name" style="color:${f.color}">${f.flag}</div><div class="legend-desc">${f.desc}</div></div></div>`

    }
